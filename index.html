<script>
'use strict';
// 应用版本号：每次发布更新（数据页底部可见，便于确认设备上跑的是哪一版）
const APP_VERSION = '2026-09-24.3';
/* ============================================================
 * EJU 间隔复习 — 单文件应用
 * 数据: localStorage（eju.items.v2）；旧版 eju.items.v1 自动迁移且保留不动
 * 调度: 间隔序列 + ○△× 分流 + 毕业月度抽查
 * ============================================================ */

// ---------- 基础工具 ----------
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// 把任意字符串安全地嵌入内联 onclick 的 JS 实参位置
function jsStr(s) {
  return JSON.stringify(String(s)).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// 日期一律使用本地时区的 YYYY-MM-DD 字符串，避免 UTC 跨日 bug
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// 每日任务的「日界」设在凌晨 2 点：00:00–01:59 仍算作前一天，
// 新一天的复习清单到凌晨 2 点才刷新（方便熬夜学习的人）。
const DAY_ROLLOVER_HOUR = 2;
function todayStr() {
  const d = new Date();
  d.setHours(d.getHours() - DAY_ROLLOVER_HOUR);
  return formatDate(d);
}
function addDaysStr(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return formatDate(d);
}
function diffDays(aStr, bStr) { // a - b（天）
  return Math.round((new Date(aStr + 'T00:00:00') - new Date(bStr + 'T00:00:00')) / 86400000);
}
function isValidDateStr(s) {
  return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00'));
}
function displayDate(dateStr) {
  if (!isValidDateStr(dateStr)) return dateStr || '-';
  const d = new Date(dateStr + 'T00:00:00');
  const dow = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}(${dow})`;
}

// ---------- 常量 ----------
const KEYS = {
  ITEMS: 'eju.items.v2',
  SESSION: 'eju.session.v1',
  PREFERENCES: 'eju.preferences.v1',
  DELETED: 'eju.deletedItems.v1',
  REMOVALS: 'eju.itemRemovals.v1',
  LEGACY_ITEMS: 'eju.items.v1',
  LEGACY_LITE_ITEMS: 'eju.v2', // 更早期精简版的数据 key
  MIGRATED_FLAG: 'eju.migrated.v1to2',
  BOOKS: 'eju.books.v1',
  ENTRY_DRAFT: 'eju.entryDraft.v1',
  TIER_REPLAY_FLAG: 'eju.tierReplay.v1',
  FIX_ESSENCE_FLAG: 'eju.fix.essenceMidori.v1',
};
const SUBJECTS = ['数学', '物理', '化学-理论', '化学-记忆'];
const BOARDS = { mondai: '母题', kakomon: '过去问' };
const SEQ_PROCEDURAL = [1, 3, 7, 14, 30];   // 程序性：数学 / 物理 / 化学-理论
const SEQ_MEMORY = [1, 2, 4, 7, 14, 30];    // 记忆性：化学-记忆
const GRAD_CYCLE_DAYS = 30;                 // 毕业后抽查周期
const GRAD_DEMOTE_DAYS = 7;                 // 抽查评 × 后降回的档位天数
const RATINGS = ['○', '△', '×'];
// JASSO 公布的 2026 年第二回 EJU 考试日，以及日本国内首场（日本语）的开始时间。
// 卡片会明确标注“日本国内首场”，避免让 09:30 看起来像所有科目的统一开考时刻。
const EJU_EXAM_TARGET = '2026-11-08T09:30:00+09:00';
const EJU_EXAM_TARGET_MS = Date.parse(EJU_EXAM_TARGET);
const EJU_EXAM_DAY_END_MS = Date.parse('2026-11-09T00:00:00+09:00');

function getEjuCountdownParts(nowMs = Date.now()) {
  const reached = nowMs >= EJU_EXAM_TARGET_MS;
  const totalSeconds = Math.max(0, Math.ceil((EJU_EXAM_TARGET_MS - nowMs) / 1000));
  return {
    reached,
    phase: !reached ? 'upcoming' : (nowMs < EJU_EXAM_DAY_END_MS ? 'exam-day' : 'finished'),
    days: Math.floor(totalSeconds / 86400),
    hours: Math.floor(totalSeconds % 86400 / 3600),
    minutes: Math.floor(totalSeconds % 3600 / 60),
    seconds: totalSeconds % 60,
  };
}
function countdownDigits(value, width = 2) {
  return String(value).padStart(width, '0');
}
function updateEjuCountdown() {
  const root = $('[data-eju-countdown]');
  if (!root) return;
  const parts = getEjuCountdownParts();
  const values = {
    days: countdownDigits(parts.days, 2),
    hours: countdownDigits(parts.hours),
    minutes: countdownDigits(parts.minutes),
    seconds: countdownDigits(parts.seconds),
  };
  Object.entries(values).forEach(([unit, value]) => {
    const el = root.querySelector(`[data-countdown-${unit}]`);
    if (el && el.textContent !== value) el.textContent = value;
  });
  root.classList.toggle('arrived', parts.reached);
  const compact = root.querySelector('[data-countdown-compact]');
  if (compact) compact.textContent = parts.phase === 'upcoming' ? `距 EJU ${parts.days} 天` : parts.phase === 'exam-day' ? 'EJU 考试日' : '本次 EJU 已结束';
  const status = root.querySelector('[data-countdown-status]');
  const statusText = parts.phase === 'upcoming'
    ? '每一秒都算数'
    : (parts.phase === 'exam-day' ? 'EJU 已开考，沉着作答' : '本次 EJU 已结束');
  if (status) status.textContent = statusText;
  root.setAttribute(
    'aria-label',
    parts.phase !== 'upcoming'
      ? statusText
      : `距离2026年第二回EJU日本国内首场开考还有${parts.days}天${parts.hours}小时${parts.minutes}分${parts.seconds}秒`
  );
}
let ejuCountdownTimer = null;
function startEjuCountdownClock() {
  if (ejuCountdownTimer) clearTimeout(ejuCountdownTimer);
  const tick = () => {
    updateEjuCountdown();
    // 对齐自然秒边界，避免 setInterval 长时间运行后产生可见漂移。
    ejuCountdownTimer = setTimeout(tick, 1020 - Date.now() % 1000);
  };
  tick();
}
function ejuCountdownCardHtml() {
  const c = getEjuCountdownParts();
  const label = c.phase === 'upcoming' ? `距 EJU ${c.days} 天` : c.phase === 'exam-day' ? 'EJU 考试日' : '本次 EJU 已结束';
  return `<details class="exam-compact" data-eju-countdown>
    <summary><span data-countdown-compact>${label}</span><span class="tiny">11月8日 · 详情</span></summary>
    <div class="exam-detail" role="timer" aria-live="off">
      <span data-countdown-days>${c.days}</span> 天
      <span data-countdown-hours>${countdownDigits(c.hours)}</span> 时
      <span data-countdown-minutes>${countdownDigits(c.minutes)}</span> 分
      <span data-countdown-seconds>${countdownDigits(c.seconds)}</span> 秒
      <p class="tiny">2026 年第 2 回 · 日本国内首场 09:30</p>
    </div>
  </details>`;
}

function isMemorySubject(subject) { return /记忆|記憶|暗記/.test(String(subject || '')); }
function seqFor(subject) { return isMemorySubject(subject) ? SEQ_MEMORY : SEQ_PROCEDURAL; }

// ---------- 存取 ----------
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    console.error('Load error:', key, e);
    return fallback;
  }
}
let suppressCloudSync = false;
function saveItems(items) {
  try {
    const tx=loadJSON(DATA_TRANSACTION_KEY,null);
    if(tx){const payload={...tx,items,books:state.books,deletedItemIds:state.deletedItemIds,itemRemovalLog:state.itemRemovalLog};localStorage.setItem(DATA_TRANSACTION_KEY,JSON.stringify(payload));flushDataTransaction(payload);}
    else localStorage.setItem(KEYS.ITEMS, JSON.stringify(items));
    state.localStatus = '本机已保存';
    if (!suppressCloudSync && state.sync.user) state.sync.status = '待上传';
    updateSyncIndicators();
    if (!suppressCloudSync) scheduleCloudPush();
    return true;
  } catch (e) {
    console.error('Save error:', e);
    state.localStatus = '本机保存失败';
    updateSyncIndicators();
    showToast('本机保存失败，请释放存储空间后重试');
    return false;
  }
}

// ---------- 数据结构 / 迁移 ----------
// v4 题目: { id, board:'mondai'|'kakomon', subject, source, note, addedDate, intervalIndex,
//            dueDate, history:[{id,date,rating,createdAt,learningOsSync?}],
//            status:'learning'|'graduated', updatedAt, legacy? }

// 同步功能上线当天仍打开旧页面时，真实完成的复习只有 date/rating，
// 没有事件 ID。仅恢复上线日及之后的这类记录，避免回填更早的历史数据。
const LEARNING_OS_RECOVERY_START_DATE = '2026-07-28';

// 缺字段时补默认值（已有题目默认 intervalIndex=0、status=learning、dueDate=明天）
function normalizeItem(item) {
  if (!item || typeof item !== 'object' || !item.id) return null;
  const subject = typeof item.subject === 'string' && item.subject ? item.subject : '数学';
  const seq = seqFor(subject);
  const status = item.status === 'graduated' ? 'graduated' : 'learning';
  let intervalIndex = Number.isInteger(item.intervalIndex) ? item.intervalIndex : 0;
  intervalIndex = Math.max(0, Math.min(seq.length - 1, intervalIndex));
  const history = Array.isArray(item.history)
    ? item.history
        .filter(h => h && isValidDateStr(h.date) && RATINGS.includes(h.rating))
        .map((h, index) => {
          const out = { date: h.date, rating: h.rating };
          if (h.scheduleVersion === 2) out.scheduleVersion = 2;
          if (h.id) out.id = String(h.id);
          const recoverForLearningOs = h.date >= LEARNING_OS_RECOVERY_START_DATE && !h.learningOsSync;
          if (!out.id && recoverForLearningOs) {
            out.id = `recovered:${item.id}:${h.date}:${index}:${h.rating}`;
          }
          if (typeof h.createdAt === 'string') out.createdAt = h.createdAt;
          if (['pending', 'syncing', 'synced', 'unmatched', 'ambiguous', 'error'].includes(h.learningOsSync)) {
            out.learningOsSync = h.learningOsSync === 'syncing' ? 'pending' : h.learningOsSync;
          } else if (recoverForLearningOs) {
            out.learningOsSync = 'pending';
          }
          if (typeof h.learningOsSyncedAt === 'string') out.learningOsSyncedAt = h.learningOsSyncedAt;
          if (typeof h.learningOsAttemptedAt === 'string') out.learningOsAttemptedAt = h.learningOsAttemptedAt;
          if (typeof h.learningOsMessage === 'string') out.learningOsMessage = h.learningOsMessage;
          return out;
        })
    : [];
  // 早期迁移的题目 board 可能还留在 legacy 里，提升到顶层
  const board = item.board === 'kakomon' || (!item.board && item.legacy?.board === 'kakomon')
    ? 'kakomon' : 'mondai';
  const out = {
    id: String(item.id),
    board,
    subject,
    source: typeof item.source === 'string' ? item.source : '',
    note: typeof item.note === 'string' ? item.note : '',
    addedDate: isValidDateStr(item.addedDate) ? item.addedDate : todayStr(),
    intervalIndex,
    dueDate: isValidDateStr(item.dueDate) ? item.dueDate : addDaysStr(todayStr(), 1),
    history,
    status,
    updatedAt: typeof item.updatedAt === 'string' ? item.updatedAt : new Date().toISOString(),
  };
  if (Array.isArray(item.removedReviewIds)) {
    out.removedReviewIds = [...new Set(item.removedReviewIds.filter(id => typeof id === 'string'))];
    out.history = out.history.filter(h => !out.removedReviewIds.includes(h.id));
  }
  if (item.legacy && typeof item.legacy === 'object') out.legacy = item.legacy;
  return out;
}

function isLegacyV1Item(item) {
  return item && typeof item === 'object' && Array.isArray(item.reviews) &&
    item.intervalIndex === undefined && item.dueDate === undefined;
}

// v1（reviews 数组排期制）→ v2。原始字段完整保留在 legacy 中，绝不丢数据。
function migrateLegacyItem(old, today) {
  const qualityMap = { good: '○', unsure: '△', again: '×' };
  const history = (old.reviews || [])
    .filter(r => r && r.status === 'done' && r.completedAt)
    .map(r => ({ date: String(r.completedAt).slice(0, 10), rating: qualityMap[r.quality] || '△' }))
    .filter(h => isValidDateStr(h.date))
    .sort((a, b) => a.date < b.date ? -1 : 1);
  const source = [old.source, old.location, old.questionNo].filter(Boolean).join(' ').trim();
  return normalizeItem({
    id: old.id,
    board: old.board,
    subject: old.subject || '未分类',
    source: source || '(无出处)',
    note: old.note || '',
    addedDate: isValidDateStr((old.createdAt || '').slice(0, 10)) ? old.createdAt.slice(0, 10) : today,
    intervalIndex: 0,
    dueDate: addDaysStr(today, 1),
    history,
    status: 'learning',
    updatedAt: old.updatedAt || old.createdAt || new Date().toISOString(),
    legacy: {
      board: old.board, difficulty: old.difficulty, source: old.source,
      location: old.location, questionNo: old.questionNo, mastery: old.mastery,
      createdAt: old.createdAt, reviews: old.reviews,
    },
  });
}

function migrateAnyItem(item, today) {
  if (isLegacyV1Item(item)) return migrateLegacyItem(item, today);
  return normalizeItem(item);
}

// 更早期精简版（eju.v2，字段缩写 b/s/src/loc/q/dif/c/u/r）→ v1 形状，再走 v1 迁移
function liteToV1Item(item) {
  if (!item || typeof item !== 'object') return null;
  const difficultyMap = { n: 'normal', h: 'hard', c: 'critical' };
  const toISO = s => !s ? '' : (/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T00:00:00' : String(s));
  return {
    id: item.id || uid(),
    board: item.b === 'k' ? 'kakomon' : 'mondai',
    subject: item.s || '未分类',
    source: item.src || '',
    location: item.loc || '',
    questionNo: item.q || '',
    note: item.note || '',
    difficulty: difficultyMap[item.dif] || 'normal',
    createdAt: toISO(item.c) || new Date().toISOString(),
    updatedAt: toISO(item.u || item.c) || undefined,
    reviews: Array.isArray(item.r) ? item.r.map(rv => ({
      dueDate: rv.d,
      status: rv.done ? 'done' : 'pending',
      completedAt: rv.done ? toISO(rv.at || rv.d) : null,
      quality: null,
    })) : [],
  };
}

// 页面加载时迁移。旧 key eju.items.v1 原样保留，作为永久备份。
function loadAndMigrateItems() {
  const today = todayStr();
  const v2 = loadJSON(KEYS.ITEMS, null);
  if (Array.isArray(v2)) {
    return repairMigratedTiers(v2.map(it => migrateAnyItem(it, today)).filter(Boolean));
  }
  const v1 = loadJSON(KEYS.LEGACY_ITEMS, null);
  if (Array.isArray(v1) && v1.length) {
    const migrated = v1.map(it => migrateAnyItem(it, today)).filter(Boolean);
    try { localStorage.setItem(KEYS.MIGRATED_FLAG, new Date().toISOString()); } catch (e) {}
    return repairMigratedTiers(migrated);
  }
  const lite = loadJSON(KEYS.LEGACY_LITE_ITEMS, null);
  if (Array.isArray(lite) && lite.length) {
    const migrated = lite.map(liteToV1Item).filter(Boolean)
      .map(it => migrateAnyItem(it, today)).filter(Boolean);
    try { localStorage.setItem(KEYS.MIGRATED_FLAG, new Date().toISOString()); } catch (e) {}
    return repairMigratedTiers(migrated);
  }
  return [];
}

// 由复习记录推算档位/状态/到期日（history 非空时按时间顺序回放）。
// 纯函数、幂等，不改 updatedAt——保证同步合并时不会因回放而虚增"新鲜度"。
function recomputeItem(item) {
  if (!item.history || !item.history.length) return item;
  const sorted = item.history.slice()
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const sim = {
    subject: item.subject,
    status: 'learning',
    intervalIndex: 0,
    dueDate: item.dueDate,
    history: [],
  };
  for (const h of sorted) applyRating(sim, h.rating, h.date, false, h.scheduleVersion || 1);
  item.history = sorted;
  item.intervalIndex = sim.intervalIndex;
  item.status = sim.status;
  item.dueDate = sim.dueDate;
  return item;
}
// 迁移题目的档位修正：不把旧题一律归到档位 1，而是把保留下来的复习记录
// 按新规则逐次回放，推算出当前应处的档位和到期日，让旧数据自然接入新循环。
function replayHistoryTiers(item) {
  if (!item.legacy || !item.history.length || item.status === 'graduated') return item;
  return recomputeItem(item);
}
function repairMigratedTiers(items) {
  try { if (localStorage.getItem(KEYS.TIER_REPLAY_FLAG)) return items; } catch (e) {}
  const out = items.map(replayHistoryTiers);
  try { localStorage.setItem(KEYS.TIER_REPLAY_FLAG, new Date().toISOString()); } catch (e) {}
  return out;
}

// 出处一次性修正：物理のエッセンス 緑 系列，在「緑」与紧跟的数字之间补「熱」→「緑 熱 12」。
// 仅作用于「緑」后直接跟数字的条目；已写明 電磁気 / 原子 等（緑后非数字）的不受影响。
function fixEssenceMidoriSource(items) {
  for (const it of items) {
    if (typeof it.source !== 'string') continue;
    if (!it.source.includes('エッセンス')) continue;
    if (!/緑\s*\d/.test(it.source)) continue;
    const next = it.source.replace(/緑\s*(?=\d)/g, '緑 熱 ');
    if (next !== it.source) {
      it.source = next;
      it.updatedAt = new Date().toISOString();
    }
  }
  return items;
}

function bookKey(board, subject) { return `${board}|${subject}`; }
function normalizeBooks(b) {
  const out = {};
  if (b && typeof b === 'object') {
    for (const [k, list] of Object.entries(b)) {
      if (!Array.isArray(list)) continue;
      const clean = [...new Set(list.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()))].slice(0, 20);
      if (clean.length) out[k] = clean;
    }
  }
  return out;
}

function saveBooks(books) {

    if (!suppressCloudSync) scheduleCloudPush();

}
function mergeBooks(a, b) {

  for (const [k, list] of Object.entries(normalizeBooks(b))) {

// ---------- 核心调度逻辑 ----------
// ○: intervalIndex+1（最后一档→毕业）；△: 档位不变；×: 归零、明天再来
// 新评分：维护题 × → 明天补救，△ → 7 天后；旧评分仍按旧规则回放。
function applyRating(item, rating, today, recordHistory = true, scheduleVersion = recordHistory ? 2 : 1) {
  const seq = seqFor(item.subject);
  let reviewEvent = null;
  if (recordHistory) {
    reviewEvent = {
      id: uid(),
      date: today,
      rating,
      createdAt: new Date().toISOString(),
      learningOsSync: 'pending',
      scheduleVersion,
    };
    item.history.push(reviewEvent);
  }
  if (item.status === 'graduated') {
    if (rating === '×') {
      item.status = 'learning';
      const idx = scheduleVersion >= 2 ? 0 : seq.indexOf(GRAD_DEMOTE_DAYS);
      item.intervalIndex = idx >= 0 ? idx : seq.length - 2;
      item.dueDate = addDaysStr(today, seq[item.intervalIndex]);
    } else if (rating === '△' && scheduleVersion >= 2) {
      item.status = 'learning';
      item.intervalIndex = seq.indexOf(7);
      item.dueDate = addDaysStr(today, 7);
    } else {
      item.dueDate = addDaysStr(today, GRAD_CYCLE_DAYS);
    }
  } else if (rating === '○') {
    if (item.intervalIndex >= seq.length - 1) {
      item.status = 'graduated';
      item.dueDate = addDaysStr(today, GRAD_CYCLE_DAYS);
    } else {
      item.intervalIndex += 1;
      item.dueDate = addDaysStr(today, seq[item.intervalIndex]);
    }
  } else if (rating === '△') {
    item.dueDate = addDaysStr(today, seq[item.intervalIndex]);
  } else { // ×
    item.intervalIndex = 0;
    item.dueDate = addDaysStr(today, 1);
  }
  item.updatedAt = new Date().toISOString();
  return reviewEvent || item;
}

function createItem(subject, source, note, today, board = 'mondai') {
  const seq = seqFor(subject);
  return {
    id: uid(),
    board: board === 'kakomon' ? 'kakomon' : 'mondai',
    subject,
    source: source.trim(),
    note: (note || '').trim(),
    addedDate: today,
    intervalIndex: 0,
    dueDate: addDaysStr(today, seq[0]),
    history: [],

  };
}

// 今日任务: learning 到期题（逾期在前）+ 毕业抽查题（随机序，列表末尾）
function getDueTasks(items, today) {
  const learning = items.filter(i => i.status === 'learning' && i.dueDate <= today);
  const overdue = learning.filter(i => i.dueDate < today)
    .sort((a, b) => a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0);
  const dueToday = learning.filter(i => i.dueDate === today);
  const gradChecks = shuffle(items.filter(i => i.status === 'graduated' && i.dueDate <= today));
  return { overdue, dueToday, gradChecks };
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function completedCountOn(items, dateStr) {
  return items.reduce((n, i) => n + i.history.filter(h => h.date === dateStr).length, 0);
}
function scheduledCountOn(items, dateStr) {
  return items.filter(i =>
    (i.status === 'learning' || i.status === 'graduated') && i.dueDate === dateStr
  ).length;
}
function groupBySubject(list) {
  const map = new Map();
  for (const it of list) {
    if (!map.has(it.subject)) map.set(it.subject, []);
    map.get(it.subject).push(it);
  }
  return map;
}

function scrollCurrentViewToTop(behavior = 'auto') {

function navigate(view) {

function animateCountUp(selector = '.summary-nums .num') {
  if (prefersReducedMotion()) return;
  $$(selector).forEach(el => {
    const target = parseInt(el.textContent, 10);
    if (!Number.isFinite(target) || target <= 0) return;
    const dur = 360, start = performance.now();
    el.textContent = '0';
    const tick = now => {
      if(prefersReducedMotion()){el.textContent=String(target);return;}
      const p = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 4)));
      if (p < 1) requestAnimationFrame(tick); else el.textContent = String(target);
    };
    requestAnimationFrame(tick);
  });
}

  const firstVisit = !state.seenViews.has(state.view);

function stableGradOrder(gradChecks, today) {
  if (state.gradOrderDate !== today) {
    state.gradOrderDate = today;
    state.gradOrder = gradChecks.map(i => i.id);
  } else {
    const known = new Set(state.gradOrder);
    gradChecks.forEach(i => { if (!known.has(i.id)) state.gradOrder.push(i.id); });
  }
  const pos = new Map(state.gradOrder.map((id, idx) => [id, idx]));
  return gradChecks.slice().sort((a, b) => (pos.get(a.id) ?? 0) - (pos.get(b.id) ?? 0));
}

// Display only: never change source or use this parsing for sync identity.
function sourceParts(item) {
  const source = item.source || '';
  const known = (state.books[bookKey(item.board,item.subject)] || []).slice().sort((a,b)=>b.length-a.length);
  const book = known.find(b => source.startsWith(b + ' '));
  if (book) return {book, location:source.slice(book.length).trim()};
  const m = source.match(/^(.+?)\s+((?:[pP]\.?\s*|[Qq]\s*|例題?\s*|第\s*)?[0-9０-９].*)$/u);
  return m ? {book:m[1],location:m[2]} : {book:source,location:''};

function restoreReviewSnapshot(id, before, eventId) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  const removedReviewIds = [...new Set([...(item.removedReviewIds || []), ...(before.removedReviewIds || []), eventId])];
  const history = mergeHistories(before.history, item.history).filter(h => !removedReviewIds.includes(h.id));
  Object.assign(item, before, { history, removedReviewIds, updatedAt: new Date().toISOString() });

  session={...saved,results:Array.isArray(saved.results)?saved.results:[],baseline:saved.baseline||{},paused:true,busy:false,entered:false};

    if(pending.kind==='rate'&&item?.history.some(h=>h.id===pending.eventId)) {
      if(!session.results.some(r=>r.eventId===pending.eventId))session.results.push({itemId:pending.itemId,eventId:pending.eventId,rating:pending.rating});
      session.idx=Math.max(session.idx,pending.idx+1);
      sessionUndoInfo={id:pending.itemId,before:pending.before,rating:pending.rating,idx:pending.idx,eventId:pending.eventId};
    }

      session.results=session.results.filter(r=>r.eventId!==pending.eventId);
      session.idx=pending.idx;sessionUndoInfo=null;
      session.baseline[pending.itemId]=historyStamp(item);

  }
  session.results=session.results.filter(r=>state.items.find(i=>i.id===r.itemId)?.history.some(h=>h.id===r.eventId));
  session.counts={'○':0,'△':0,'×':0};
  session.results.forEach(r=>{if(RATINGS.includes(r.rating))session.counts[r.rating]++;});
  if(sessionUndoInfo) {

// Preserve references held by in-flight Learning OS requests while refreshing

function adoptItems(items) {
  const existing=new Map(state.items.map(i=>[i.id,i]));
  return items.map(next=>{
    const item=existing.get(next.id);if(!item)return next;
    const events=new Map(item.history.filter(h=>h.id).map(h=>[h.id,h]));
    const history=next.history.map(h=>{const event=events.get(h.id);if(!event)return h;Object.assign(event,h);return event;});

  state.deletedItemIds=deletedIdsFromLog(state.itemRemovalLog);

  if(!checkpointSession()){Object.assign(item,before);delete session.pending;session.busy=false;return;}

  }

  state.entryBook = (state.books[key] || []).includes(book) ? book : (!Object.hasOwn(state.entryBooks,key) && !state.entryDraft.source ? (state.books[key]||[])[0]||null : null);

function entrySources() {
  const book = (state.books[bookKey(state.entryBoard, state.entrySubject)] || []).includes(state.entryBook) ? state.entryBook : null;
  const raw = (book ? state.entryDraft.num : state.entryDraft.source).trim();
  if (!raw) return [];
  if (!book || !state.entryDraft.batch) return [book ? `${book} ${raw}` : raw];
  const values = [];
  for (const part of raw.split(/[,，、\n]+/).map(v => v.trim()).filter(Boolean)) {
    const range = part.match(/^(\d+)\s*[-–~～]\s*(\d+)$/);
    if (range) {
      const a = Number(range[1]), b = Number(range[2]);
      if (!Number.isSafeInteger(a) || !Number.isSafeInteger(b) || b < a || b-a >= 50) throw new Error('题号范围需递增，每次最多 50 题');
      for (let n=a;n<=b;n++) values.push(`${book} ${n}`);
    } else values.push(`${book} ${part}`);
    if (values.length > 50) throw new Error('每次最多录入 50 题');
  }
  return [...new Set(values)];
}

  state.entryContextOpen=false;

  persistEntryDraft();

  const name = state.bookNameDraft.trim();

  const key = bookKey(state.entryBoard, state.entrySubject);
  const list = state.books[key] || (state.books[key] = []);
  if (!list.includes(name)) {
    if (list.length >= 20) { showToast('每组最多 20 本书'); return; }
    list.push(name);
    saveBooks(state.books);
  }
  state.bookComposer = false;
  state.bookNameDraft = '';

}

function removeBook(name) {
  const key = bookKey(state.entryBoard, state.entrySubject);
  const list = state.books[key] || [];
  const idx = list.indexOf(name);
  if (idx < 0) return;
  if (!confirm(`从常用书目移除「${name}」？（不影响已录入的题目）`)) return;
  list.splice(idx, 1);
  if (!list.length) delete state.books[key];
  if (state.entryBook === name) state.entryBook = null;
  saveBooks(state.books);
  renderEntry();
}

function cancelAddedItems(ids) {

  const itemRemovalLog=markItemRemoval(state.itemRemovalLog,ids,true);

  const items=state.items.filter(i=>!ids.includes(i.id));
  if(!commitDataTransaction({items,books:state.books,deletedItemIds:deleted,itemRemovalLog,clearSession:false}))return false;
  state.entryMessage='已撤销本次录入';

function addItem() {
  let sources;
  try{sources=entrySources();}catch(error){showToast(error.message);return;}
  const input=$('#entry-num')||$('#entry-source');
  if(!sources.length){input?.focus();return;}
  const fresh=sources.filter(source=>!entryDuplicate(source));
  if(!fresh.length){renderEntryPreview();showToast('这些题目已在题库中');input?.focus();return;}
  const added=fresh.map(source=>createItem(state.entrySubject,source,state.entryDraft.note,todayStr(),state.entryBoard));
  state.items.push(...added);
  if(!saveItems(state.items)){state.items.splice(-added.length);return;}
  state.entryDraft[input?.id==='entry-num'?'num':'source']='';state.entryDraft.note='';persistEntryDraft();
  if(input)input.value='';if($('#entry-note'))$('#entry-note').value='';
  state.justAdded=added.at(-1).id;
  state.entryMessage=`本机已添加 ${added.length} 题 · 明天首次复习${sources.length>fresh.length?' · 已跳过重复题':''}`;
  $('#entry-success').textContent=state.entryMessage;
  $('#entry-recent').innerHTML=renderEntryRecent();renderEntryPreview();updateBadge();
  state.justAdded=null;
  showToast(state.entryMessage,()=>cancelAddedItems(added.map(i=>i.id)));
  input?.focus({preventScroll:true});
}
window.addItem=addItem;

function deleteItem(id, evt) {
  const idx = state.items.findIndex(i => i.id === id);
  if (idx < 0) return;
  const removed = state.items[idx];
  if (!confirm(`删除「${removed.source}」？`)) return;
  const proceed = () => {
    const at = state.items.indexOf(removed);
    if (at < 0) { render(); return; } // 动画期间列表已被其他来源改动（如云同步合并），放弃本次删除
    state.items.splice(at, 1);
    if(!saveItems(state.items)){state.items.splice(at,0,removed);return;}
    render();
    showToast('已删除', () => {
      state.items.push(removed);
      saveItems(state.items);
      render();
      flashCard(removed.id);
    });
  };
  const row = evt && evt.target && evt.target.closest ? evt.target.closest('.lib-item') : null;
  if (row && !prefersReducedMotion()) {
    row.style.height = row.offsetHeight + 'px';
    void row.offsetWidth;
    row.classList.add('leaving');
    setTimeout(proceed, 330);
  } else {
    proceed();
  }
}
window.deleteItem = deleteItem;

// 合并两份复习记录：新记录按事件 ID 去重；旧记录仍按 日期+评级 去重。
// 因此同一天同一题出现两次相同评级时，新版也不会误删其中一次。
function mergeHistories(a, b) {
  const seen = new Set();
  const out = [];
  for (const h of [...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])]) {
    if (!h || !h.date || !h.rating) continue;
    const k = h.id ? `id:${h.id}` : `legacy:${h.date}|${h.rating}`;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push({ ...h });
  }
  out.sort((x, y) => {
    const aTime = x.createdAt || x.date;
    const bTime = y.createdAt || y.date;
    return aTime < bTime ? -1 : aTime > bTime ? 1 : 0;
  });
  return out;
}
// 同一道题（同 id）跨设备合并：取复习记录并集后重算档位，让进度更靠前的一方胜出，
// 不再用时间戳整条二选一（旧逻辑会让"晚加载但更旧"的设备覆盖已复习的设备）。
function mergeItems(a, b) {
  if (!a) return recomputeItem(b);
  if (!b) return recomputeItem(a);
  const ta = Date.parse(a.updatedAt || '') || 0;
  const tb = Date.parse(b.updatedAt || '') || 0;
  const base = tb > ta ? b : a; // 出处/备注等可编辑字段取较新一方
  const removedReviewIds = [...new Set([...(a.removedReviewIds || []), ...(b.removedReviewIds || [])])];
  const merged = {
    ...base,
    addedDate: (a.addedDate && b.addedDate)
      ? (a.addedDate < b.addedDate ? a.addedDate : b.addedDate)
      : (a.addedDate || b.addedDate),
    legacy: a.legacy || b.legacy,
    history: mergeHistories(a.history, b.history).filter(h => !removedReviewIds.includes(h.id)),
    removedReviewIds,
    updatedAt: (tb > ta ? b.updatedAt : a.updatedAt) || new Date().toISOString(),

}

      if(signature!==JSON.stringify([state.items,state.books,state.deletedItemIds,state.itemRemovalLog])){setSyncStatus('待上传');scheduleCloudPush();return false;}
      setSyncStatus('已同步');if(!silent)showToast('云端已同步');return true;
    }catch(error){setSyncStatus('同步失败：'+cloudErrorMessage(error));return false;}
  })();
  try{return await cloudUploadPromise;}finally{cloudUploadPromise=null;}
}

// ---------- AI Learning OS（Google Sheets 单向同步） ----------
// 浏览器只调用已登录用户可访问的 Supabase Edge Function。
// Apps Script 地址和同步密钥只存在于 Edge Function secrets，绝不进入本文件或仓库。
const LEARNING_OS_FUNCTION = 'learning-os-sheet-sync-v6';
const LEARNING_OS_RETRYABLE = new Set(['pending', 'unmatched', 'ambiguous', 'error']);
const LEARNING_OS_AUTOMATIC = new Set(['pending', 'error']);
const LEARNING_OS_UNDO_DELAY_MS = 6000;
const LEARNING_OS_REQUEST_TIMEOUT_MS = 15000;
const LEARNING_OS_RETRY_DELAY_MS = 15000;
const LEARNING_OS_STUCK_AFTER_MS = 70000;
const LEARNING_OS_WATCHDOG_INTERVAL_MS = 10000;
const LEARNING_OS_EVENT_GAP_MS = 700;
const LEARNING_OS_TRANSPORT_RETRY_DELAYS_MS = [0, 1200, 4000];
let learningOsSyncTimer = null;
let learningOsSyncDueAt = 0;
let learningOsRetryTimer = null;
let learningOsSyncBusy = false;
let learningOsSyncStartedAt = 0;
let learningOsSyncRunId = 0;

function learningOsEvents() {
  return state.items.flatMap(item => (item.history || [])
    .filter(event => event && event.id && event.learningOsSync)
    .map(event => ({ item, event })));
}

function learningOsCounts() {
  const counts = { pending: 0, synced: 0, unmatched: 0, ambiguous: 0, error: 0 };
  learningOsEvents().forEach(({ event }) => {
    const key = event.learningOsSync === 'syncing' ? 'pending' : event.learningOsSync;
    if (Object.prototype.hasOwnProperty.call(counts, key)) counts[key]++;
  });
  return counts;
}

function learningOsMatchedItemCount() {
  const matched = new Set();
  learningOsEvents().forEach(({ item, event }) => {
    if (event.learningOsSync === 'synced') matched.add(item.id);
  });
  return matched.size;
}

function learningOsReadyAt(event) {
  if (sessionUndoInfo?.eventId && sessionUndoInfo.eventId === event?.id) return Infinity;
  const createdAt = Date.parse(event?.createdAt || '');
  return Number.isFinite(createdAt) ? createdAt + LEARNING_OS_UNDO_DELAY_MS : 0;
}

function learningOsPastUndoWindow(event, now = Date.now()) {
  return learningOsReadyAt(event) <= now;
}

function scheduleNextLearningOsSync(delayOverride = null) {
  const now = Date.now();
  const readyAt = delayOverride === null
    ? learningOsEvents()
        .filter(({ event }) => event.learningOsSync === 'pending')
        .reduce((earliest, { event }) => Math.min(earliest, learningOsReadyAt(event)), Infinity)
    : now + Math.max(0, delayOverride);
  if (!Number.isFinite(readyAt)) return;
  if (learningOsSyncTimer && readyAt >= learningOsSyncDueAt) return;
  clearTimeout(learningOsSyncTimer);
  learningOsSyncDueAt = readyAt;
  learningOsSyncTimer = setTimeout(() => {
    learningOsSyncTimer = null;
    learningOsSyncDueAt = 0;
    // 撤销会恢复评分前快照，事件随之消失，批处理中自然找不到它。
    // 只发送已经经过撤销窗口的事件；后录入的事件保留各自完整的撤销时间。
    syncPendingReviewEvents(true, false);
  }, Math.max(0, readyAt - now));
}

function queueLearningOsSync(_itemId, _eventId, delay = LEARNING_OS_UNDO_DELAY_MS) {
  scheduleNextLearningOsSync(delay);
}

function scheduleLearningOsRetry() {
  clearTimeout(learningOsRetryTimer);
  if (document.hidden || !learningOsEvents().some(({ event }) =>
    event.learningOsSync === 'error')) return;
  learningOsRetryTimer = setTimeout(() => {
    learningOsRetryTimer = null;
    syncPendingReviewEvents(true, false);
  }, LEARNING_OS_RETRY_DELAY_MS);
}

function resetStuckLearningOsEvents(now = Date.now(), force = false) {
  let changed = false;
  learningOsEvents().forEach(({ event }) => {
    if (event.learningOsSync !== 'syncing') return;
    const attemptedAt = Date.parse(event.learningOsAttemptedAt || '');
    if (!force && Number.isFinite(attemptedAt) &&
        now - attemptedAt < LEARNING_OS_STUCK_AFTER_MS) return;
    event.learningOsSync = 'pending';
    event.learningOsMessage = '上次同步在页面挂起时中断，已自动重新排队';
    changed = true;
  });
  if (changed) saveItems(state.items);
  return changed;
}

async function learningOsErrorMessage(error) {
  const fallback = cloudErrorMessage(error);
  if (error?.learningOsDetails) return error.learningOsDetails;
  const context = error?.context;
  if (!context) return fallback;
  try {
    const response = typeof context.clone === 'function' ? context.clone() : context;
    const data = await response.json();
    return data?.message || data?.error || fallback;
  } catch (e) {
    return fallback;
  }
}

function learningOsDelay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function fetchLearningOsOnce(payload, accessToken) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), LEARNING_OS_REQUEST_TIMEOUT_MS);
  let response;
  try {
    response = await fetch(
      `${SUPABASE_URL}/functions/v1/${encodeURIComponent(LEARNING_OS_FUNCTION)}`,
      {
        method: 'POST',
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-store',
        signal: controller.signal,
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${accessToken}`,
          'x-client-info': `eju-review-site/${APP_VERSION}`,
        },
        body: JSON.stringify(payload),
      }
    );
  } catch (error) {
    const detail = error?.name === 'AbortError'
      ? `请求超过 ${Math.round(LEARNING_OS_REQUEST_TIMEOUT_MS / 1000)} 秒`
      : (error?.message || String(error));
    const wrapped = new Error(`无法连接同步服务：${detail}`);
    wrapped.cause = error;
    wrapped.learningOsTransport = true;
    throw wrapped;
  } finally {
    clearTimeout(timeout);
  }

  let text = '';
  try {
    text = await response.text();
  } catch (error) {
    const detail = error?.message || String(error);
    const wrapped = new Error(`同步响应读取失败：${detail}`);
    wrapped.cause = error;
    wrapped.learningOsTransport = true;
    throw wrapped;
  }
  let data = null;
  if (text) {
    try {
      data = JSON.parse(text);
    } catch (_error) {
      data = { message: text };
    }
  }
  if (!response.ok) {
    const error = new Error(`同步服务返回 HTTP ${response.status}`);
    error.learningOsDetails = data?.message || data?.error || error.message;
    error.learningOsTransport = [408, 425, 429, 500, 502, 503, 504].includes(response.status);
    throw error;
  }
  return data;
}

async function invokeLearningOsFunction(payload) {
  const sb = getSupabase();
  if (!sb) throw new Error('同步库未能加载');

  // iOS 主屏幕 Web App 偶发会让 supabase-js 的 functions.invoke 包装层直接抛
  // FunctionsFetchError，实际 Edge Function、CORS 与网络仍然可用。这里使用同一
  // 登录会话发出标准原生 fetch，避免包装层状态随页面冻结/恢复而失效。
  const { data: sessionData, error: sessionError } = await sb.auth.getSession();
  if (sessionError) throw sessionError;
  const accessToken = sessionData?.session?.access_token;
  if (!accessToken) throw new Error('登录状态已失效，请重新登录云同步账号');

  let lastError = null;
  for (let attempt = 0; attempt < LEARNING_OS_TRANSPORT_RETRY_DELAYS_MS.length; attempt++) {
    if (document.hidden) {
      const error = new Error('页面已进入后台，回到前台后会自动继续同步');
      error.learningOsTransport = true;
      throw error;
    }
    if (navigator.onLine === false) {
      const error = new Error('当前处于离线状态，联网后会自动继续同步');
      error.learningOsTransport = true;
      throw error;
    }
    const delay = LEARNING_OS_TRANSPORT_RETRY_DELAYS_MS[attempt];
    if (delay) await learningOsDelay(delay);
    try {
      return await fetchLearningOsOnce(payload, accessToken);
    } catch (error) {
      lastError = error;
      if (!error?.learningOsTransport) throw error;
    }
  }

  const detail = lastError?.learningOsDetails || lastError?.message || '未知网络错误';
  const error = new Error(`连续 ${LEARNING_OS_TRANSPORT_RETRY_DELAYS_MS.length} 次连接失败`);
  error.learningOsDetails = `${error.message}：${detail}`;
  error.learningOsTransport = true;
  throw error;
}

async function syncLearningOsEvent(item, event) {
  const sb = getSupabase();
  if (!sb || !state.sync.user || !item || !event || !LEARNING_OS_RETRYABLE.has(event.learningOsSync)) {
    return false;
  }
  event.learningOsSync = 'syncing';
  event.learningOsAttemptedAt = new Date().toISOString();
  event.learningOsMessage = '';
  saveItems(state.items);
  if (state.view === 'data') renderData();
  try {
    const data = await invokeLearningOsFunction({
      item: {
        id: item.id,
        board: item.board,
        subject: item.subject,
        source: item.source,
        note: item.note,
        addedDate: item.addedDate,
      },
      event: {
        id: event.id,
        date: event.date,
        rating: event.rating,
        createdAt: event.createdAt,
      },
    });
    const status = data?.status;
    if (!['synced', 'unmatched', 'ambiguous'].includes(status)) {
      throw new Error(data?.message || '同步服务返回了未知状态');
    }
    event.learningOsSync = status;
    event.learningOsMessage = data?.message || '';
    if (status === 'synced') event.learningOsSyncedAt = new Date().toISOString();
    saveItems(state.items);
    if (state.view === 'data') renderData();
    return status === 'synced';
  } catch (error) {
    event.learningOsSync = 'error';
    event.learningOsMessage = await learningOsErrorMessage(error);
    saveItems(state.items);
    if (state.view === 'data') renderData();
    return false;
  }
}

async function syncPendingReviewEvents(silent = false, includeMatchRetries = true) {
  const startedNow = Date.now();
  if (learningOsSyncBusy && startedNow - learningOsSyncStartedAt < LEARNING_OS_STUCK_AFTER_MS) return;
  // iOS 可能冻结一个永不返回的旧请求；超过阈值后启动新一轮。
  // review_event_id 让迟到的旧请求与新请求仍保持幂等。
  if (learningOsSyncBusy) learningOsSyncBusy = false;
  if (!state.sync.user) {
    if (!silent) showToast('请先登录云同步账号');
    return;
  }
  // 能走到这里说明当前没有仍受保护的活动批次。若 localStorage 中还留有
  // syncing，它来自页面关闭/冻结前的孤儿请求，应立即重新排队，而不是再等超时。
  resetStuckLearningOsEvents(startedNow, true);
  const runId = ++learningOsSyncRunId;
  learningOsSyncBusy = true;
  learningOsSyncStartedAt = startedNow;
  clearTimeout(learningOsRetryTimer);
  learningOsRetryTimer = null;
  if (state.view === 'data') renderData();
  try {
    const now = Date.now();
    const pending = learningOsEvents().filter(({ event }) =>
      learningOsPastUndoWindow(event, now) &&
      (LEARNING_OS_AUTOMATIC.has(event.learningOsSync) ||
        (includeMatchRetries && LEARNING_OS_RETRYABLE.has(event.learningOsSync))))
      // 先处理上一轮失败的事件；若网络仍不稳定，不继续消耗后续待发送记录。
      .sort((a, b) => Number(b.event.learningOsSync === 'error') -
        Number(a.event.learningOsSync === 'error'));
    for (let index = 0; index < pending.length; index++) {
      const { item, event } = pending[index];
      await syncLearningOsEvent(item, event);
      if (event.learningOsSync === 'error') break;
      if (index < pending.length - 1) await learningOsDelay(LEARNING_OS_EVENT_GAP_MS);
    }
  } finally {
    if (runId === learningOsSyncRunId) {
      learningOsSyncBusy = false;
      learningOsSyncStartedAt = 0;
    }
  }
  if (state.view === 'data') renderData();
  const counts = learningOsCounts();
  if (counts.error) {
    clearTimeout(learningOsSyncTimer);
    learningOsSyncTimer = null;
    learningOsSyncDueAt = 0;
    scheduleLearningOsRetry();
  } else {
    scheduleNextLearningOsSync();
  }
  if (!silent) {
    showToast(counts.error ? '匹配检查完成；部分同步请求失败，可稍后重试' : 'Learning OS 匹配检查完成');
  }
}
window.syncPendingReviewEvents = syncPendingReviewEvents;

function initLearningOsAutoRecovery() {
  const resume = () => {
    if (document.hidden) return;
    // 回到前台时也重新检查之前未匹配的记录：用户可能刚在表格补录原题。
    syncPendingReviewEvents(true, true);
  };
  window.addEventListener('pageshow', resume);
  window.addEventListener('online', resume);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearTimeout(learningOsRetryTimer);
      learningOsRetryTimer = null;
    } else {
      resume();
    }
  });
  setInterval(() => {
    if (!document.hidden && learningOsEvents().some(({ event }) =>
      event.learningOsSync === 'syncing' ||
      LEARNING_OS_AUTOMATIC.has(event.learningOsSync))) {
      syncPendingReviewEvents(true, false);
    }
  }, LEARNING_OS_WATCHDOG_INTERVAL_MS);
}

// ---------- Toast ----------
function showToast(msg, undoFn) {
  if (toastTimer) clearTimeout(toastTimer);
  const wrap = $('#toast-wrap');
  wrap.innerHTML = `<div class="toast"><span>${escapeHtml(msg)}</span>${undoFn ? '<button class="undo" id="toast-undo">撤销</button>' : ''}</div>`;
  if (undoFn) {
    $('#toast-undo').addEventListener('click', () => {
      const original=wrap.firstElementChild;
      const result=undoFn();
      if(result===false||wrap.firstElementChild!==original)return;
      wrap.innerHTML = '';
      clearTimeout(toastTimer);
      toastTimer = null;
    });
  }
  toastTimer = setTimeout(() => {
    const t = wrap.querySelector('.toast');
    if (t && !prefersReducedMotion()) {
      t.classList.add('out');
      toastTimer = setTimeout(() => { wrap.innerHTML = ''; toastTimer = null; }, 200);
    } else {
      wrap.innerHTML = '';
      toastTimer = null;
    }
  }, undoFn ? 5000 : 2400);
}

// ---------- iOS 独立 Web App 外壳 ----------
function isStandaloneWebApp() {
  return window.matchMedia?.('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}

function standaloneViewportHeight() {
  // The physical screen can include an OS-owned status bar or another iPad
  // window. Use the web layout viewport, shared by the shell and its footer.
  const root = document.documentElement;
  const height = root.clientHeight || window.innerHeight;
  const viewport = window.visualViewport;
  return root.classList.contains('keyboard-open') && viewport
    ? viewport.height : height;
}

function updateStandaloneShellHeight() {
  const height = standaloneViewportHeight();
  if (!Number.isFinite(height) || height <= 0) return;
  document.documentElement.style.setProperty(
    '--standalone-app-height',
    `${height}px`
  );
}

function initStandaloneShell() {
  if (!isStandaloneWebApp()) return;
  document.documentElement.classList.add('standalone-shell');
  updateStandaloneShellHeight();
  let timers = [];
  const schedule = () => {
    timers.forEach(clearTimeout);
    timers = [0, 150, 500].map(delay =>
      setTimeout(() => { updateKeyboardViewport(); updateStandaloneShellHeight(); }, delay)
    );
  };
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', schedule);
  window.addEventListener('pageshow', schedule);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(); });
}

function updateKeyboardViewport() {
  const viewport = window.visualViewport;
  if (!viewport) return;
  const root = document.documentElement;
  const input = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
  const height = root.clientHeight || window.innerHeight;
  // Pinch zoom also shrinks visualViewport; it is not a software keyboard.
  const unzoomed = Math.abs((viewport.scale || 1) - 1) < 0.01;
  root.classList.toggle('keyboard-open', input && unzoomed && height - viewport.height > 120);
  if (root.classList.contains('standalone-shell')) updateStandaloneShellHeight();
}

const disclosureAnimations=new WeakMap();
function animateDisclosure(element) {
  if(!element?.animate||prefersReducedMotion())return;
  element.animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],{duration:280,easing:'cubic-bezier(.22,1,.36,1)'});
}
function toggleDisclosure(details) {
  const previous=disclosureAnimations.get(details),target=!(previous?.target??details.open);
  const from=details.getBoundingClientRect().height;
  if(previous){previous.animation.oncancel=null;previous.animation.cancel();disclosureAnimations.delete(details);}
  details.style.height='';details.style.overflow='';
  if(!details.animate||prefersReducedMotion()){details.open=target;if(target)details.__fill?.();return;}
  details.open=true;
  if(details.classList.contains('subject-group'))fillSubjectGroup(details);
  details.__fill?.();
  const to=target?details.getBoundingClientRect().height:details.querySelector('summary').getBoundingClientRect().height;
  details.style.overflow='hidden';
  const animation=details.animate([{height:from+'px'},{height:to+'px'}],{duration:300,easing:'cubic-bezier(.22,1,.36,1)'});
  disclosureAnimations.set(details,{animation,target});
  const finish=()=>{details.open=target;details.style.height='';details.style.overflow='';disclosureAnimations.delete(details);};
  animation.onfinish=finish;animation.oncancel=finish;
}
function initInterfaceBehavior() {
  document.addEventListener('click',e=>{
    const summary=e.target.closest?.('summary');
    if(!summary||e.target.closest('button,a,input,select,textarea'))return;
    const d=summary.parentElement;
    if(d?.tagName==='DETAILS'){e.preventDefault();toggleDisclosure(d);}
  });
  document.addEventListener('keydown',e=>{
    const modal=$('#modal-root [role="dialog"]')||$('#session-root [role="dialog"]');if(!modal)return;
    if(e.key==='Escape'){e.preventDefault();if(pendingImport)closeImportDialog();else endSession();return;}
    if(e.key!=='Tab')return;
    const focusables=[...modal.querySelectorAll('button:not([disabled]),input,select,textarea,summary,[tabindex="0"]')].filter(el=>el.offsetParent!==null);
    const first=focusables[0],last=focusables.at(-1);
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
  });
  window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',applyPreferences);
  window.matchMedia?.('(prefers-reduced-motion: reduce)').addEventListener?.('change',applyPreferences);
  const viewport=window.visualViewport;
  if(viewport){
    viewport.addEventListener('resize',updateKeyboardViewport);
    document.addEventListener('focusin',updateKeyboardViewport);
    // activeElement changes after focusout; read it on the next task.
    document.addEventListener('focusout',()=>setTimeout(updateKeyboardViewport,0));
    updateKeyboardViewport();
  }
  const refresh=()=>{
    if(document.hidden){if(session)checkpointSession();return;}
    if(session){readLatestReviewItems();reconcileSession();checkpointSession();if(!session.paused)renderSession();else if(state.view==='review')renderReview();}
  };
  document.addEventListener('visibilitychange',refresh);window.addEventListener('pageshow',refresh);
  window.addEventListener('pagehide',()=>{if(session)checkpointSession();});
  window.addEventListener('storage',e=>{
    if([KEYS.ITEMS,KEYS.DELETED,DATA_TRANSACTION_KEY].includes(e.key)){
      readLatestReviewItems();if(session){reconcileSession();checkpointSession();if(!session.paused)renderSession();}render();
    }
  });
}

// ---------- 初始化 ----------
function init() {
  initStandaloneShell();
  const preferences=loadJSON(KEYS.PREFERENCES,{});
  state.preferences={theme:['light','dark'].includes(preferences.theme)?preferences.theme:'system',motion:preferences.motion==='reduced'?'reduced':'system'};
  state.reviewLimit=[5,10,20,'all'].includes(preferences.reviewLimit)?preferences.reviewLimit:5;
  state.reviewSubject=typeof preferences.reviewSubject==='string'?preferences.reviewSubject:'all';
  applyPreferences();
  const journal=loadJSON(DATA_TRANSACTION_KEY,null);
  if(journal&&Array.isArray(journal.items)){
    state.items=journal.items.map(normalizeItem).filter(Boolean);state.books=normalizeBooks(journal.books);state.itemRemovalLog=normalizeRemovalLog(journal.itemRemovalLog,journal.deletedItemIds);state.deletedItemIds=deletedIdsFromLog(state.itemRemovalLog);flushDataTransaction(journal);
  }else{
    state.items = fixMathSubjectNameOnce(fixEssenceMidoriOnce(loadAndMigrateItems()));
    state.books = loadBooks();state.itemRemovalLog=normalizeRemovalLog(loadJSON(KEYS.REMOVALS,{}),loadJSON(KEYS.DELETED,[]));state.deletedItemIds=deletedIdsFromLog(state.itemRemovalLog);
  }
  state.items=state.items.filter(i=>!state.deletedItemIds.includes(i.id));
  restoreEntryDraft();
  if(!journal?.clearSession)restoreSession();
  initInterfaceBehavior();
  initLearningOsAutoRecovery();
  suppressCloudSync = true;
  saveItems(state.items); // 持久化迁移/补全结果
  seedPresetBooks();
  restoreEntryBook();
  suppressCloudSync = false;
  $$('.nav-btn').forEach(btn => btn.addEventListener('click', () => navigate(btn.dataset.view)));
  $('#import-file').addEventListener('change', onImportFile);
  $('#today-date').textContent = todayStr().slice(5).replace('-','月')+'日';
  // 跨日自动刷新（页面长开时）
  let shownDay = todayStr();
  setInterval(() => {
    const t = todayStr();
    if (t !== shownDay) {
      shownDay = t;
      $('#today-date').textContent = t.slice(5).replace('-','月')+'日';
      render();
    }
  }, 60 * 1000);
  startEjuCountdownClock();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) updateEjuCountdown();
  });
  render();
  afterViewRender();
  // supabase-js 是 defer 加载的：就绪则立即启动同步，否则等页面 load 后再启动
  if (window.supabase) initCloudSync();
  else window.addEventListener('load', initCloudSync, { once: true });
}
if (typeof document !== 'undefined' && typeof window !== 'undefined' && !window.__EJU_TEST__) {
  init();
}
</script>
