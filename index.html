<title>EJU 间隔复习</title>
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0b09" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* ============ 设计令牌：暖石墨工作台 ============ */
:root {
  color-scheme: light dark;
  --bg: #f6f5f2;
  --card: #ffffff;
  --surface-2: #efede8;
  --text: #1c1917;
  --muted: #6d675e;
  --faint: #a39d92;
  --line: #e7e4de;
  --hover-border: #d3cec4;
  --accent: #c2410c;
  --accent-dim: #ecc9b4;
  --accent-soft: #fbeee4;
  --ring: rgba(194, 65, 12, .25);
  --brand-from: #ea580c;
  --brand-to: #f59e0b;
  --btn-bg: #c2410c;
  --good: #047857;  --good-soft: #e6f4ee;  --good-border: #bfe3d2;
  --mid: #a16207;   --mid-soft: #faf3d9;   --mid-border: #eadfa8;
  --bad: #dc2626;   --bad-soft: #fdecec;   --bad-border: #f3cccc;
  --grad: #0f766e;  --grad-soft: #e4f3f1;  --grad-border: #bfe0dc;
  --kako: #2563eb;  --kako-soft: #e9effc;  --kako-btn: #2563eb;  --kako-ring: rgba(37, 99, 235, .25);
  --overdue-border: #f0caca;
  --gradcheck-border: #c4ded9;
  --bar: #b45309;
  --bar-today: #92400e;
  --bar-zero: #eae7e1;
  --glass: rgba(255, 255, 255, .82);
  --glow: rgba(234, 88, 12, .07);
  --toast-bg: #211d18;
  --toast-text: #faf8f5;
  --toast-border: rgba(255, 255, 255, .08);
  --toast-undo: #fdba74;
  --shadow-sm: 0 1px 2px rgba(28, 25, 23, .05);
  --shadow-md: 0 6px 24px -8px rgba(28, 25, 23, .16);
  --shadow-lift: 0 4px 14px -4px rgba(28, 25, 23, .13);
  --radius: 12px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
  --font-display: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  /* 动效体系：一套曲线家族 + 时长节奏，全站统一 */
  --ease-out: cubic-bezier(.22, 1, .36, 1);      /* 入场/落位：快起缓收 */
  --ease-in: cubic-bezier(.5, 0, .75, .6);       /* 离场：缓起加速 */
  --ease-smooth: cubic-bezier(.45, 0, .22, 1);   /* 位移/宽度等连续变化 */
  --ease-spring: cubic-bezier(.34, 1.45, .64, 1);/* 按压回弹/俏皮瞬间 */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0b09;
    --card: #171511;
    --surface-2: #221f19;
    --text: #ece9e3;
    --muted: #a39c8f;
    --faint: #6b6558;
    --line: rgba(231, 222, 205, .12);
    --hover-border: rgba(231, 222, 205, .3);
    --accent: #fb923c;
    --accent-dim: #6b4423;
    --accent-soft: rgba(249, 115, 22, .14);
    --ring: rgba(251, 146, 60, .35);
    --brand-from: #f97316;
    --brand-to: #fbbf24;
    --btn-bg: #c2410c;
    --good: #34d399;  --good-soft: rgba(16, 185, 129, .12);  --good-border: rgba(52, 211, 153, .3);
    --mid: #facc15;   --mid-soft: rgba(202, 138, 4, .13);    --mid-border: rgba(250, 204, 21, .28);
    --bad: #f87171;   --bad-soft: rgba(239, 68, 68, .13);    --bad-border: rgba(248, 113, 113, .3);
    --grad: #2dd4bf;  --grad-soft: rgba(20, 184, 166, .13);  --grad-border: rgba(45, 212, 191, .3);
    --kako: #7da9f8;  --kako-soft: rgba(59, 130, 246, .15);  --kako-btn: #2f62d8;  --kako-ring: rgba(125, 169, 248, .35);
    --overdue-border: rgba(248, 113, 113, .32);
    --gradcheck-border: rgba(45, 212, 191, .32);
    --bar: #d97706;
    --bar-today: #f59e0b;
    --bar-zero: #2a261e;
    --glass: rgba(15, 13, 10, .8);
    --glow: rgba(249, 115, 22, .13);
    --toast-bg: #ece9e3;
    --toast-text: #1c1917;
    --toast-border: transparent;
    --toast-undo: #c2410c;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-md: 0 8px 28px -8px rgba(0, 0, 0, .6);
    --shadow-lift: 0 4px 16px -4px rgba(0, 0, 0, .5);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto 0; height: 360px; z-index: -1;
  background: radial-gradient(120% 100% at 50% 0%, var(--glow), transparent 68%);
  pointer-events: none;
}
::selection { background: rgba(234, 88, 12, .2); }

.app { max-width: 620px; margin: 0 auto; padding: 0 16px calc(92px + env(safe-area-inset-bottom)); min-width: 0; }

/* ---------- 全局品牌行（瘦） ---------- */
.header { padding: 16px 2px 4px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(145deg, var(--brand-from), var(--brand-to)); color: #fff;
  box-shadow: 0 4px 14px -3px rgba(234, 88, 12, .55), inset 0 1px 0 rgba(255, 255, 255, .28);
}
.brand-mark svg { width: 19px; height: 19px; }
.app-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { font-size: 9.5px; color: var(--faint); letter-spacing: .14em; text-transform: uppercase; font-weight: 500; margin-top: 1px; }
.today-date { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 500; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; box-shadow: var(--shadow-sm); }

/* ---------- 每页大标题 ---------- */
.screen-head { margin: 14px 4px 14px; }
.screen-title { font-family: var(--font-display); font-size: 23px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.screen-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

/* ---------- 底部导航 ---------- */
.nav-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--glass); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 8px 0 8px; font-size: 11px; font-weight: 500; color: var(--muted); font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  position: relative; min-height: 58px; transition: color .18s ease;
}
.nav-label { line-height: 1; }
.nav-btn .ico { display: grid; place-items: center; padding: 3px 14px; border-radius: 999px; transition: background .22s ease; }
.nav-btn .ico svg { width: 21px; height: 21px; stroke-width: 1.75; transition: transform .18s ease; }
.nav-btn.active { color: var(--accent); font-weight: 600; }
.nav-btn.active .ico { background: var(--accent-soft); }
.nav-btn.active .ico svg { transform: translateY(-.5px); }
.nav-btn.active::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 26px; height: 3px; border-radius: 0 0 4px 4px; background: linear-gradient(90deg, var(--brand-from), var(--brand-to)); }
.nav-btn .badge {
  position: absolute; top: 3px; right: calc(50% - 26px);
  background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; font-family: var(--font-mono);
  border-radius: 999px; min-width: 17px; height: 17px; line-height: 17px; padding: 0 4px; box-shadow: 0 0 0 2px var(--card);
}
.badge.hidden { display: none; }

/* ---------- 基础组件 ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); overflow-wrap: anywhere; }
.card.danger-card { border-color: var(--bad-border); }
.section-title { font-size: 11.5px; font-weight: 600; color: var(--muted); margin: 22px 4px 10px; letter-spacing: .07em; text-transform: uppercase; }
.small { font-size: 13px; color: var(--muted); }
.tiny { font-size: 12px; color: var(--muted); }
.mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mt12 { margin-top: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.flex1 { flex: 1; min-width: 0; }
.center { text-align: center; }

.btn {
  appearance: none; border: 1px solid transparent; cursor: pointer; border-radius: 10px;
  background: var(--btn-bg); color: #fff; font-size: 14.5px; font-weight: 600; font-family: inherit;
  padding: 11px 16px; min-height: 44px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), var(--shadow-sm);
  transition: filter .15s ease, transform .1s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.btn:hover { filter: brightness(1.07); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), var(--shadow-lift); }
.btn:active { transform: translateY(1px); filter: brightness(.97); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.btn.secondary { background: var(--card); color: var(--text); border-color: var(--line); box-shadow: var(--shadow-sm); }
.btn.secondary:hover { background: var(--surface-2); filter: none; border-color: var(--hover-border); }
.btn.danger { background: var(--bad); }
.btn.kako { background: var(--kako-btn); }
.btn.small { font-size: 13px; padding: 8px 13px; min-height: 38px; }
.btn.block { display: block; width: 100%; }

/* 主 CTA */
.cta {
  appearance: none; border: 0; cursor: pointer; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  border-radius: 14px; padding: 16px; min-height: 56px; margin-bottom: 16px;
  background: linear-gradient(135deg, var(--brand-from), var(--brand-to));
  color: #fff; font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: -.01em;
  box-shadow: 0 8px 22px -6px rgba(234, 88, 12, .5), inset 0 1px 0 rgba(255, 255, 255, .28);
  transition: filter .15s ease, transform .12s cubic-bezier(.34, 1.56, .64, 1), box-shadow .15s ease;
}
.cta svg { width: 20px; height: 20px; stroke-width: 2.2; }
.cta:hover { filter: brightness(1.06); }
.cta:active { transform: scale(.98); }
.cta .cta-count { font-family: var(--font-mono); font-size: 13px; font-weight: 600; background: rgba(255, 255, 255, .22); border-radius: 999px; padding: 2px 10px; }

.form-input, select.form-input {
  width: 100%; border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 13px; font-size: 16px; font-family: inherit; background: var(--card); color: var(--text);
  min-height: 44px; transition: border-color .15s ease, box-shadow .15s ease;
}
.form-input::placeholder { color: var(--faint); }
.form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.form-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }

.subject-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.subject-pick button {
  appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 11px 6px; font-size: 14.5px; font-family: inherit; color: var(--text); min-height: 46px;
  font-weight: 500; transition: all .16s ease;
}
.subject-pick button:hover { border-color: var(--hover-border); }
.subject-pick button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.subject-pick.seg { background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.subject-pick.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 40px; color: var(--muted); }
.subject-pick.seg button:hover { color: var(--text); }
.subject-pick.seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--line); }
/* 母题/过去问的颜色身份（录入页分段控件） */
.subject-pick.seg button.on.bm { background: var(--accent-soft); color: var(--accent); box-shadow: var(--shadow-sm), inset 0 0 0 1.5px var(--accent); }
.subject-pick.seg button.on.bk { background: var(--kako-soft); color: var(--kako); box-shadow: var(--shadow-sm), inset 0 0 0 1.5px var(--kako); }
/* 录入卡整体随类型换主题：母题=琥珀橙，过去问=钢蓝。
   通过在卡片作用域重映射 accent 系列变量，科目选项卡、书目胶囊、
   输入框焦点圈、添加按钮等全部子控件自动跟随换色。 */
.entry-card { border-top: 3px solid var(--accent); background: linear-gradient(180deg, var(--accent-soft) 0, var(--card) 130px); }
.entry-card.kakomon { --accent: var(--kako); --accent-soft: var(--kako-soft); --ring: var(--kako-ring); --btn-bg: var(--kako-btn); }

/* 常用书目胶囊 */
.book-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.book-chip {
  appearance: none; cursor: pointer; font-family: inherit;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 500; min-height: 38px;
  transition: all .15s ease; overflow-wrap: anywhere;
}
.book-chip:hover { border-color: var(--hover-border); }
.book-chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
.book-chip.ghost { border-style: dashed; color: var(--muted); background: transparent; }
.book-chip .bx { margin-left: 6px; font-weight: 700; color: var(--bad); }

/* ---------- 复习页仪表盘 ---------- */
.sticky-summary {
  position: sticky; top: 10px; z-index: 40;
  background: var(--glass); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px 13px; margin-bottom: 12px; box-shadow: var(--shadow-md);
}
.summary-nums { display: flex; gap: 24px; }
.summary-nums .num { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.summary-nums .lbl { font-size: 11px; color: var(--muted); margin-top: 5px; letter-spacing: .02em; }
.progress-wrap { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
.progress { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand-from), var(--brand-to)); transition: width .6s var(--ease-smooth); }
.progress.done i { background: var(--good); }
.progress-pct { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--muted); min-width: 36px; text-align: right; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.chip { font-size: 12px; font-weight: 500; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; }
.chip.zero { background: var(--surface-2); color: var(--faint); }

.group-title { font-size: 13px; font-weight: 700; margin: 20px 4px 10px; display: flex; align-items: center; gap: 7px; }
.group-title svg { width: 15px; height: 15px; stroke-width: 2; flex: none; }
.group-title.red { color: var(--bad); }
.group-title.grad { color: var(--grad); }
.count-pill { font-family: var(--font-mono); font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 1px 8px; }
.group-title.red .count-pill { background: var(--bad-soft); color: var(--bad); }
.group-title.grad .count-pill { background: var(--grad-soft); color: var(--grad); }
.sub-label { font-size: 12px; color: var(--muted); margin: 10px 2px 8px; padding-left: 9px; border-left: 3px solid var(--accent-dim); border-radius: 1px; line-height: 1.3; }

/* 任务卡 */
.task-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px; margin-bottom: 10px; box-shadow: var(--shadow-sm); overflow-wrap: anywhere; transition: transform .22s var(--ease-out), box-shadow .22s var(--ease-out), opacity .24s var(--ease-in); }
.task-card.overdue { border-color: var(--overdue-border); box-shadow: inset 3px 0 0 var(--bad), var(--shadow-sm); }
.task-card.gradcheck { border-color: var(--gradcheck-border); box-shadow: inset 3px 0 0 var(--grad), var(--shadow-sm); }
.task-card.leaving {
  opacity: 0; transform: translateX(44px) scale(.98); pointer-events: none;
  height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important;
  margin-bottom: 0 !important; border-top-width: 0; border-bottom-width: 0; overflow: hidden;
  transition: transform .26s var(--ease-in), opacity .2s var(--ease-in),
    height .3s var(--ease-smooth) .06s, padding .3s var(--ease-smooth) .06s,
    margin .3s var(--ease-smooth) .06s, border-width .3s var(--ease-smooth) .06s;
}
@media (hover: hover) {
  .task-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); }
  .task-card.overdue:hover { box-shadow: inset 3px 0 0 var(--bad), var(--shadow-lift); }
  .task-card.gradcheck:hover { box-shadow: inset 3px 0 0 var(--grad), var(--shadow-lift); }
}
.task-top { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.task-source { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
.task-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag { font-size: 11px; font-weight: 500; border-radius: 6px; padding: 2px 8px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.stage { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: -.02em; }
.tag.subj { background: var(--accent-soft); color: var(--accent); }
.tag.late { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.tag.grad { background: var(--grad-soft); color: var(--grad); font-weight: 600; }
.tag.board-kakomon { background: var(--kako-soft); color: var(--kako); font-weight: 600; }
.task-note { font-size: 13px; color: var(--muted); margin-top: 8px; white-space: pre-wrap; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; }

/* 评级按钮 */
.rate-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; margin-top: 14px; }
.rate-btn {
  appearance: none; cursor: pointer; border-radius: 11px; border: 1px solid transparent;
  min-height: 64px; font-family: inherit; font-weight: 700; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; padding: 6px;
  position: relative; overflow: visible;
  transition: transform .12s cubic-bezier(.34, 1.56, .64, 1), box-shadow .15s ease, filter .15s ease;
}
.rate-btn .mark { font-size: 26px; line-height: 1; }
.rate-btn .lbl { font-size: 11px; font-weight: 600; opacity: .85; }
.rate-good { background: var(--good-soft); color: var(--good); border-color: var(--good-border); }
.rate-mid { background: var(--mid-soft); color: var(--mid); border-color: var(--mid-border); }
.rate-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-border); }
.rate-btn:hover { box-shadow: var(--shadow-sm); }
.rate-btn:active { transform: scale(.93); filter: brightness(.95); }
.rate-btn::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 2px solid currentColor; opacity: 0; pointer-events: none; }
.rate-btn.pressed::after { animation: ratePulse .38s var(--ease-out); }
@keyframes ratePulse { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.16); } }
.rate-btn.pressed .mark { animation: markPop .3s var(--ease-spring); }
@keyframes markPop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
.rate-btn.xl { min-height: 78px; border-radius: 14px; }
.rate-btn.xl .mark { font-size: 31px; }
.rate-btn.xl .lbl { font-size: 12px; }

/* 空状态 */
.empty { text-align: center; color: var(--muted); padding: 52px 16px; font-size: 14.5px; }
.empty .big { font-size: 40px; margin-bottom: 10px; }
.empty-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--text); margin: 14px 0 4px; }
.success-scene { position: relative; width: 96px; height: 96px; margin: 0 auto; }
.success-mark { width: 96px; height: 96px; }
.success-mark .ring { fill: none; stroke: var(--good); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 151; stroke-dashoffset: 151; animation: drawRing .7s var(--ease-smooth) forwards; }
.success-mark .tick { fill: none; stroke: var(--good); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 34; stroke-dashoffset: 34; animation: drawTick .36s var(--ease-out) .55s forwards; }
@keyframes drawRing { to { stroke-dashoffset: 0; } }
@keyframes drawTick { to { stroke-dashoffset: 0; } }
.confetti i { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; border-radius: 999px; opacity: 0; animation: burst .7s cubic-bezier(.22, .61, .36, 1) .55s forwards; }
.confetti i:nth-child(1) { background: var(--brand-from); --dx: -46px; --dy: -34px; }
.confetti i:nth-child(2) { background: var(--good);       --dx: 44px;  --dy: -40px; }
.confetti i:nth-child(3) { background: var(--brand-to);   --dx: -52px; --dy: 16px; }
.confetti i:nth-child(4) { background: var(--mid);        --dx: 50px;  --dy: 22px; animation-delay: .6s; }
.confetti i:nth-child(5) { background: var(--accent);     --dx: -20px; --dy: -54px; animation-delay: .62s; }
.confetti i:nth-child(6) { background: var(--grad);       --dx: 24px;  --dy: 50px; animation-delay: .58s; }
@keyframes burst { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 22% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.05); } }
.calm-ico { width: 64px; height: 64px; color: var(--faint); margin: 0 auto; display: block; stroke-width: 1.5; }

/* ---------- 题库 ---------- */
.lib-item { border-top: 1px solid var(--line); padding: 13px 2px; }
.lib-item:first-child { border-top: 0; }
.lib-main { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; cursor: pointer; }
.chev { flex: none; padding-top: 3px; color: var(--faint); }
.chev svg { width: 16px; height: 16px; stroke-width: 2; transition: transform .3s var(--ease-spring); }
.chev.open svg { transform: rotate(180deg); }
.lib-detail { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); animation: detailIn .32s var(--ease-out); }
@keyframes detailIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.hist-list { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin: 10px 0; display: flex; flex-wrap: wrap; gap: 5px; }
.hist-pill { border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; background: var(--surface-2); }

/* ---------- 统计 ---------- */
.stat-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 15px; box-shadow: var(--shadow-sm); position: relative; }
.stat-tile .tval { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat-tile .tval small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.stat-tile .tlbl { font-size: 11px; color: var(--muted); margin-top: 5px; letter-spacing: .02em; }
.stat-tile .tico { position: absolute; top: 12px; right: 12px; color: var(--faint); }
.stat-tile .tico svg { width: 16px; height: 16px; stroke-width: 1.8; }
.stat-tile.hot .tval { color: var(--accent); }

.stat-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.stat-table th, .stat-table td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
.stat-table tr:last-child td { border-bottom: 0; }
.stat-table th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.stat-table th.r, .stat-table td.r { text-align: right; }
.stat-table td.r { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mini-meter { display: block; height: 3px; width: 60px; margin: 5px 0 1px auto; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.mini-meter i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--brand-from), var(--brand-to)); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 104px; margin-top: 14px; padding-top: 14px; border-bottom: 1px solid var(--line); }
.bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; position: relative; }
.bar { width: 100%; max-width: 14px; background: var(--bar); border-radius: 4px 4px 1px 1px; min-height: 3px; transform-origin: bottom; animation: barGrow .65s var(--ease-out) both; }
.bar.zero { background: var(--bar-zero); }
.bar.today { background: linear-gradient(180deg, var(--brand-to), var(--bar-today)); }
.bar-val { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; color: var(--accent); margin-bottom: 3px; line-height: 1; }
.bar-x { font-family: var(--font-mono); font-size: 9px; color: var(--faint); margin-top: 6px; }
@keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

/* ---------- 专注模式 ---------- */
.session {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
}
/* 外壳入场只在进入专注模式时播一次；之后评级只换卡片，顶栏/按钮不再闪 */
.session.enter { animation: sessionIn .44s var(--ease-out); }
@keyframes sessionIn { from { opacity: 0; transform: translateY(32px) scale(.99); } to { opacity: 1; transform: none; } }
.session::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 300px; pointer-events: none;
  background: radial-gradient(110% 100% at 50% 0%, var(--glow), transparent 70%);
}
.session-top { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; position: relative; }
.session-close {
  appearance: none; border: 1px solid var(--line); background: var(--card); cursor: pointer;
  width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center;
  color: var(--muted); flex: none; box-shadow: var(--shadow-sm); transition: border-color .15s ease, color .15s ease;
}
.session-close:hover { border-color: var(--hover-border); color: var(--text); }
.session-close svg { width: 17px; height: 17px; stroke-width: 2.2; }
.session-progress { flex: 1; height: 5px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.session-progress i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand-from), var(--brand-to)); transition: width .45s var(--ease-smooth); }
.session-count { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--muted); flex: none; min-width: 44px; text-align: right; }
.session-body { flex: 1; display: flex; flex-direction: column; padding: 8px 20px; overflow-y: auto; position: relative; max-width: 620px; width: 100%; margin: 0 auto; }
.session-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; box-shadow: var(--shadow-md); overflow-wrap: anywhere; margin: auto 0; }
.session-card.gradcheck { border-color: var(--gradcheck-border); box-shadow: inset 3px 0 0 var(--grad), var(--shadow-md); }
.session-card.overdue { border-color: var(--overdue-border); box-shadow: inset 3px 0 0 var(--bad), var(--shadow-md); }
.session-source { font-size: 20px; font-weight: 650; line-height: 1.45; letter-spacing: -.01em; }
.session-card .task-meta { margin-top: 12px; }
.session-card .task-note { margin-top: 12px; }
/* 重叠式换卡：旧卡以"发牌"姿态滑出（克隆幽灵层），新卡同时从对侧滑入，全程无空档 */
.session-card.swap-in { animation: swapIn .52s var(--ease-out); }
.session-card.swap-in-rev { animation: swapInRev .52s var(--ease-out); }
@keyframes swapIn { from { opacity: 0; transform: translateX(52px) scale(.965); } to { opacity: 1; transform: none; } }
@keyframes swapInRev { from { opacity: 0; transform: translateX(-52px) scale(.965); } to { opacity: 1; transform: none; } }
.session-card.ghost-out { animation: ghostOut .48s var(--ease-in) forwards; pointer-events: none; z-index: 2; will-change: transform, opacity; }
@keyframes ghostOut {
  40% { opacity: .9; }
  to { opacity: 0; transform: translate(-86px, 10px) rotate(-2.8deg) scale(.94); }
}
.session-foot { padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); max-width: 620px; width: 100%; margin: 0 auto; position: relative; }
.session-rate { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.session-undo {
  appearance: none; border: 0; background: none; cursor: pointer; font-family: inherit;
  display: block; margin: 12px auto 0; font-size: 12.5px; font-weight: 600; color: var(--muted);
  padding: 6px 14px; border-radius: 999px; transition: color .15s ease, background .15s ease;
}
.session-undo:hover { color: var(--text); background: var(--surface-2); }
.session-undo.hidden { display: none; }
/* 会话总结 */
.session-summary { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; position: relative; max-width: 620px; width: 100%; margin: 0 auto; }
.session-summary > * { animation: viewEnter .55s var(--ease-out) both; }
.session-summary > *:nth-child(2) { animation-delay: .05s; }
.session-summary > *:nth-child(3) { animation-delay: .1s; }
.session-summary > *:nth-child(4) { animation-delay: .15s; }
.session-summary > *:nth-child(n+5) { animation-delay: .2s; }
.session-summary .empty-title { font-size: 21px; }
.sum-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sum-grid { display: flex; gap: 34px; margin: 26px 0 8px; }
.sum-grid .num { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1; }
.sum-grid .lbl { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.sum-meta { display: flex; gap: 8px; margin: 10px 0 26px; flex-wrap: wrap; justify-content: center; }
.sum-meta .tag { font-size: 12px; padding: 4px 12px; }
.session-summary .btn { min-width: 200px; }

/* ---------- Toast ---------- */
.toast-wrap { position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; justify-content: center; z-index: 110; pointer-events: none; padding: 0 16px; }
.toast {
  background: var(--toast-bg); color: var(--toast-text); border-radius: 12px; padding: 11px 16px;
  font-size: 13.5px; font-weight: 500; display: flex; gap: 16px; align-items: center; max-width: 100%;
  box-shadow: 0 12px 32px -8px rgba(0, 0, 0, .4); pointer-events: auto; border: 1px solid var(--toast-border);
  animation: toast-in .34s var(--ease-spring);
}
.toast.toast-leave { animation: toast-out .22s var(--ease-in) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(10px) scale(.98); } }
.toast .undo { appearance: none; border: 0; background: none; color: var(--toast-undo); font-weight: 700; font-size: 13.5px; cursor: pointer; padding: 2px 4px; font-family: inherit; }

.danger-text { color: var(--bad); }
.hidden { display: none; }
button:focus-visible, .nav-btn:focus-visible, .subject-pick button:focus-visible, .rate-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* ---------- 页面切换（方向感知） ---------- */
@keyframes viewEnter { from { opacity: 0; transform: translateY(16px) scale(.995); } to { opacity: 1; transform: none; } }
@keyframes slideFromRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes slideFromLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
.view-enter > * { animation: viewEnter .55s var(--ease-out) both; }
.slide-l > * { animation: slideFromRight .46s var(--ease-out) both; }
.slide-r > * { animation: slideFromLeft .46s var(--ease-out) both; }
.view-enter > *:nth-child(2), .slide-l > *:nth-child(2), .slide-r > *:nth-child(2) { animation-delay: .03s; }
.view-enter > *:nth-child(3), .slide-l > *:nth-child(3), .slide-r > *:nth-child(3) { animation-delay: .06s; }
.view-enter > *:nth-child(4), .slide-l > *:nth-child(4), .slide-r > *:nth-child(4) { animation-delay: .09s; }
.view-enter > *:nth-child(n+5), .slide-l > *:nth-child(n+5), .slide-r > *:nth-child(n+5) { animation-delay: .12s; }
@keyframes navIndicator { from { transform: translateX(-50%) scaleX(.2); opacity: 0; } to { transform: translateX(-50%) scaleX(1); opacity: 1; } }
.nav-btn.active::before { animation: navIndicator .32s var(--ease-spring); }
@keyframes navPop { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }
.nav-btn.active .ico svg { animation: navPop .34s var(--ease-out); }
</style>
</head>

<script>
'use strict';
// 应用版本号：每次发布更新（数据页底部可见，便于确认设备上跑的是哪一版）
const APP_VERSION = '2026-07-06.1';
/* ============================================================
 * EJU 间隔复习 — 单文件应用
 * 数据: localStorage（eju.items.v2）；旧版 eju.items.v1 自动迁移且保留不动
 * 调度: 间隔序列 + ○△× 分流 + 毕业月度抽查
 * ============================================================ */

// ---------- 基础工具 ----------
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// 把任意字符串安全地嵌入内联 onclick 的 JS 实参位置
function jsStr(s) {
  return JSON.stringify(String(s)).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// 日期一律使用本地时区的 YYYY-MM-DD 字符串，避免 UTC 跨日 bug
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// 每日任务的「日界」设在凌晨 2 点：00:00–01:59 仍算作前一天，
// 新一天的复习清单到凌晨 2 点才刷新（方便熬夜学习的人）。
const DAY_ROLLOVER_HOUR = 2;
function todayStr() {
  const d = new Date();
  d.setHours(d.getHours() - DAY_ROLLOVER_HOUR);
  return formatDate(d);
}
function addDaysStr(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return formatDate(d);
}
function diffDays(aStr, bStr) { // a - b（天）
  return Math.round((new Date(aStr + 'T00:00:00') - new Date(bStr + 'T00:00:00')) / 86400000);
}
function isValidDateStr(s) {
  return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00'));
}
function displayDate(dateStr) {
  if (!isValidDateStr(dateStr)) return dateStr || '-';
  const d = new Date(dateStr + 'T00:00:00');
  const dow = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}(${dow})`;
}

// ---------- 常量 ----------
const KEYS = {
  ITEMS: 'eju.items.v2',
  LEGACY_ITEMS: 'eju.items.v1',
  LEGACY_LITE_ITEMS: 'eju.v2', // 更早期精简版的数据 key
  MIGRATED_FLAG: 'eju.migrated.v1to2',
  BOOKS: 'eju.books.v1',
  TIER_REPLAY_FLAG: 'eju.tierReplay.v1',
  FIX_ESSENCE_FLAG: 'eju.fix.essenceMidori.v1',
};
const SUBJECTS = ['数学', '物理', '化学-理论', '化学-记忆'];
const BOARDS = { mondai: '母题', kakomon: '过去问' };
const SEQ_PROCEDURAL = [1, 3, 7, 14, 30];   // 程序性：数学 / 物理 / 化学-理论
const SEQ_MEMORY = [1, 2, 4, 7, 14, 30];    // 记忆性：化学-记忆
const GRAD_CYCLE_DAYS = 30;                 // 毕业后抽查周期
const GRAD_DEMOTE_DAYS = 7;                 // 抽查评 × 后降回的档位天数
const RATINGS = ['○', '△', '×'];

function isMemorySubject(subject) {
  return /记忆|記憶|暗記/.test(String(subject || ''));
}
function seqFor(subject) {
  return isMemorySubject(subject) ? SEQ_MEMORY : SEQ_PROCEDURAL;
}

// ---------- 存取 ----------
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    console.error('Load error:', key, e);
    return fallback;
  }
}
let suppressCloudSync = false;
function saveItems(items) {
  try {
    localStorage.setItem(KEYS.ITEMS, JSON.stringify(items));
    if (!suppressCloudSync) scheduleCloudPush();
  } catch (e) {
    console.error('Save error:', e);
    alert('保存失败: ' + e.message);
  }
}

// ---------- 数据结构 / 迁移 ----------
// v2 题目: { id, board:'mondai'|'kakomon', subject, source, note, addedDate, intervalIndex,
//            dueDate, history:[{date, rating}], status:'learning'|'graduated', updatedAt, legacy? }

// 缺字段时补默认值（已有题目默认 intervalIndex=0、status=learning、dueDate=明天）
function normalizeItem(item) {
  if (!item || typeof item !== 'object' || !item.id) return null;
  const subject = typeof item.subject === 'string' && item.subject ? item.subject : '数学';
  const seq = seqFor(subject);
  const status = item.status === 'graduated' ? 'graduated' : 'learning';
  let intervalIndex = Number.isInteger(item.intervalIndex) ? item.intervalIndex : 0;
  intervalIndex = Math.max(0, Math.min(seq.length - 1, intervalIndex));
  const history = Array.isArray(item.history)
    ? item.history
        .filter(h => h && isValidDateStr(h.date) && RATINGS.includes(h.rating))
        .map(h => ({ date: h.date, rating: h.rating }))
    : [];
  // 早期迁移的题目 board 可能还留在 legacy 里，提升到顶层
  const board = item.board === 'kakomon' || (!item.board && item.legacy?.board === 'kakomon')
    ? 'kakomon' : 'mondai';
  const out = {
    id: String(item.id),
    board,
    subject,
    source: typeof item.source === 'string' ? item.source : '',
    note: typeof item.note === 'string' ? item.note : '',
    addedDate: isValidDateStr(item.addedDate) ? item.addedDate : todayStr(),
    intervalIndex,
    dueDate: isValidDateStr(item.dueDate) ? item.dueDate : addDaysStr(todayStr(), 1),
    history,
    status,
    updatedAt: typeof item.updatedAt === 'string' ? item.updatedAt : new Date().toISOString(),
  };
  if (item.legacy && typeof item.legacy === 'object') out.legacy = item.legacy;
  return out;
}

function isLegacyV1Item(item) {
  return item && typeof item === 'object' && Array.isArray(item.reviews) &&
    item.intervalIndex === undefined && item.dueDate === undefined;
}

// v1（reviews 数组排期制）→ v2。原始字段完整保留在 legacy 中，绝不丢数据。
function migrateLegacyItem(old, today) {
  const qualityMap = { good: '○', unsure: '△', again: '×' };
  const history = (old.reviews || [])
    .filter(r => r && r.status === 'done' && r.completedAt)
    .map(r => ({ date: String(r.completedAt).slice(0, 10), rating: qualityMap[r.quality] || '△' }))
    .filter(h => isValidDateStr(h.date))
    .sort((a, b) => a.date < b.date ? -1 : 1);
  const source = [old.source, old.location, old.questionNo].filter(Boolean).join(' ').trim();
  return normalizeItem({
    id: old.id,
    board: old.board,
    subject: old.subject || '未分类',
    source: source || '(无出处)',
    note: old.note || '',
    addedDate: isValidDateStr((old.createdAt || '').slice(0, 10)) ? old.createdAt.slice(0, 10) : today,
    intervalIndex: 0,
    dueDate: addDaysStr(today, 1),
    history,
    status: 'learning',
    updatedAt: old.updatedAt || old.createdAt || new Date().toISOString(),
    legacy: {
      board: old.board, difficulty: old.difficulty, source: old.source,
      location: old.location, questionNo: old.questionNo, mastery: old.mastery,
      createdAt: old.createdAt, reviews: old.reviews,
    },
  });
}

function migrateAnyItem(item, today) {
  if (isLegacyV1Item(item)) return migrateLegacyItem(item, today);
  return normalizeItem(item);
}

// 更早期精简版（eju.v2，字段缩写 b/s/src/loc/q/dif/c/u/r）→ v1 形状，再走 v1 迁移
function liteToV1Item(item) {
  if (!item || typeof item !== 'object') return null;
  const difficultyMap = { n: 'normal', h: 'hard', c: 'critical' };
  const toISO = s => !s ? '' : (/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T00:00:00' : String(s));
  return {
    id: item.id || uid(),
    board: item.b === 'k' ? 'kakomon' : 'mondai',
    subject: item.s || '未分类',
    source: item.src || '',
    location: item.loc || '',
    questionNo: item.q || '',
    note: item.note || '',
    difficulty: difficultyMap[item.dif] || 'normal',
    createdAt: toISO(item.c) || new Date().toISOString(),
    updatedAt: toISO(item.u || item.c) || undefined,
    reviews: Array.isArray(item.r) ? item.r.map(rv => ({
      dueDate: rv.d,
      status: rv.done ? 'done' : 'pending',
      completedAt: rv.done ? toISO(rv.at || rv.d) : null,
      quality: null,
    })) : [],
  };
}

// 页面加载时迁移。旧 key eju.items.v1 原样保留，作为永久备份。
function loadAndMigrateItems() {
  const today = todayStr();
  const v2 = loadJSON(KEYS.ITEMS, null);
  if (Array.isArray(v2)) {
    return repairMigratedTiers(v2.map(it => migrateAnyItem(it, today)).filter(Boolean));
  }
  const v1 = loadJSON(KEYS.LEGACY_ITEMS, null);
  if (Array.isArray(v1) && v1.length) {
    const migrated = v1.map(it => migrateAnyItem(it, today)).filter(Boolean);
    try { localStorage.setItem(KEYS.MIGRATED_FLAG, new Date().toISOString()); } catch (e) {}
    return repairMigratedTiers(migrated);
  }
  const lite = loadJSON(KEYS.LEGACY_LITE_ITEMS, null);
  if (Array.isArray(lite) && lite.length) {
    const migrated = lite.map(liteToV1Item).filter(Boolean)
      .map(it => migrateAnyItem(it, today)).filter(Boolean);
    try { localStorage.setItem(KEYS.MIGRATED_FLAG, new Date().toISOString()); } catch (e) {}
    return repairMigratedTiers(migrated);
  }
  return [];
}

// 由复习记录推算档位/状态/到期日（history 非空时按时间顺序回放）。
// 纯函数、幂等，不改 updatedAt——保证同步合并时不会因回放而虚增"新鲜度"。
function recomputeItem(item) {
  if (!item.history || !item.history.length) return item;
  const sorted = item.history.slice()
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const sim = {
    subject: item.subject,
    status: 'learning',
    intervalIndex: 0,
    dueDate: item.dueDate,
    history: [],
  };
  for (const h of sorted) applyRating(sim, h.rating, h.date);
  item.history = sorted;
  item.intervalIndex = sim.intervalIndex;
  item.status = sim.status;
  item.dueDate = sim.dueDate;
  return item;
}
// 迁移题目的档位修正：不把旧题一律归到档位 1，而是把保留下来的复习记录
// 按新规则逐次回放，推算出当前应处的档位和到期日，让旧数据自然接入新循环。
function replayHistoryTiers(item) {
  if (!item.legacy || !item.history.length || item.status === 'graduated') return item;
  return recomputeItem(item);
}
function repairMigratedTiers(items) {
  try { if (localStorage.getItem(KEYS.TIER_REPLAY_FLAG)) return items; } catch (e) {}
  const out = items.map(replayHistoryTiers);
  try { localStorage.setItem(KEYS.TIER_REPLAY_FLAG, new Date().toISOString()); } catch (e) {}
  return out;
}

// 出处一次性修正：物理のエッセンス 緑 系列，在「緑」与紧跟的数字之间补「熱」→「緑 熱 12」。
// 仅作用于「緑」后直接跟数字的条目；已写明 電磁気 / 原子 等（緑后非数字）的不受影响。
function fixEssenceMidoriSource(items) {
  for (const it of items) {
    if (typeof it.source !== 'string') continue;
    if (!it.source.includes('エッセンス')) continue;
    if (!/緑\s*\d/.test(it.source)) continue;
    const next = it.source.replace(/緑\s*(?=\d)/g, '緑 熱 ');
    if (next !== it.source) {
      it.source = next;
      it.updatedAt = new Date().toISOString();
    }
  }
  return items;
}
// 只跑一次（用标记记住），不在之后的加载/同步中再自动改动。
function fixEssenceMidoriOnce(items) {
  try { if (localStorage.getItem(KEYS.FIX_ESSENCE_FLAG)) return items; } catch (e) {}
  fixEssenceMidoriSource(items);
  try { localStorage.setItem(KEYS.FIX_ESSENCE_FLAG, new Date().toISOString()); } catch (e) {}
  return items;
}

// 科目名一次性规整：旧科目「数学コース2」统一为「数学」。
// 两者同为程序性序列，档位/到期日不受影响；仅在确有改动时刷新 updatedAt，

// ---------- 常用书目（按 类型|科目 分组，录入时点选书名 + 手输题号） ----------
function bookKey(board, subject) { return `${board}|${subject}`; }
function normalizeBooks(b) {

}

// ---------- 核心调度逻辑 ----------
// ○: intervalIndex+1（最后一档→毕业）；△: 档位不变；×: 归零、明天再来
// 毕业题: 每 30 天抽查；抽查 × → 降回 learning 的 7 天档
function applyRating(item, rating, today) {
  const seq = seqFor(item.subject);
  item.history.push({ date: today, rating });
  if (item.status === 'graduated') {
    if (rating === '×') {
      item.status = 'learning';
      const idx = seq.indexOf(GRAD_DEMOTE_DAYS);
      item.intervalIndex = idx >= 0 ? idx : seq.length - 2;
      item.dueDate = addDaysStr(today, seq[item.intervalIndex]);
    } else {
      item.dueDate = addDaysStr(today, GRAD_CYCLE_DAYS);
    }
  } else if (rating === '○') {
    if (item.intervalIndex >= seq.length - 1) {
      item.status = 'graduated';
      item.dueDate = addDaysStr(today, GRAD_CYCLE_DAYS);
    } else {
      item.intervalIndex += 1;
      item.dueDate = addDaysStr(today, seq[item.intervalIndex]);
    }
  } else if (rating === '△') {
    item.dueDate = addDaysStr(today, seq[item.intervalIndex]);
  } else { // ×
    item.intervalIndex = 0;
    item.dueDate = addDaysStr(today, 1);
  }
  item.updatedAt = new Date().toISOString();
  return item;
}

function createItem(subject, source, note, today, board = 'mondai') {
  const seq = seqFor(subject);
  return {
    id: uid(),
    board: board === 'kakomon' ? 'kakomon' : 'mondai',
    subject,
    source: source.trim(),
    note: (note || '').trim(),
    addedDate: today,
    intervalIndex: 0,
    dueDate: addDaysStr(today, seq[0]),
    history: [],
    status: 'learning',
    updatedAt: new Date().toISOString(),
  };
}

// 今日任务: learning 到期题（逾期在前）+ 毕业抽查题（随机序，列表末尾）
function getDueTasks(items, today) {
  const learning = items.filter(i => i.status === 'learning' && i.dueDate <= today);
  const overdue = learning.filter(i => i.dueDate < today)
    .sort((a, b) => a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0);
  const dueToday = learning.filter(i => i.dueDate === today);
  const gradChecks = shuffle(items.filter(i => i.status === 'graduated' && i.dueDate <= today));
  return { overdue, dueToday, gradChecks };
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function completedCountOn(items, dateStr) {
  return items.reduce((n, i) => n + i.history.filter(h => h.date === dateStr).length, 0);
}
function groupBySubject(list) {
  const map = new Map();
  for (const it of list) {
    if (!map.has(it.subject)) map.set(it.subject, []);
    map.get(it.subject).push(it);
  }
  return map;
}

// ---------- 渲染 ----------
// 所有对 #main 的重建都必须经过这里：先剥离入场动画类再写入内容。
// 只有 navigate()/init() 会在渲染之后重新挂类，因此评级、筛选切换、
// 展开题目、云同步回调等任何普通重渲染都不会重放入场动画。
function setMain(html) {
  const m = $('#main');
  if (!m) return;
  m.classList.remove('view-enter', 'slide-l', 'slide-r');
  m.innerHTML = html;
}
function render() {
  updateBadge();
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  switch (state.view) {
    case 'review': renderReview(); break;
    case 'entry': renderEntry(); break;
    case 'library': renderLibrary(); break;
    case 'stats': renderStats(); break;
    case 'data': renderData(); break;
  }
}
const VIEW_ORDER = ['review', 'entry', 'library', 'stats', 'data'];
function navigate(view) {
  const from = state.view;
  // 点击当前已激活的标签：不重放入场动画，滚回顶部即可
  if (view === from) {
    render();
    try { window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' }); } catch (e) {}
    return;
  }
  state.view = view;
  render();
  // 方向感知：按标签顺序决定滑入方向
  const a = VIEW_ORDER.indexOf(from), b = VIEW_ORDER.indexOf(view);
  afterViewRender(a >= 0 && b >= 0 ? (b > a ? 'l' : 'r') : null);
}
// ---------- 视图切换动效（仅切换标签/首次加载时触发，评级等操作不重放） ----------
function prefersReducedMotion() {
  return false; // 按用户要求：动效始终开启，不跟随系统"减弱动态效果"
}
function animateMainEnter(dir) {
  const m = $('#main');
  if (!m) return;
  // render() 已剥离动画类；此处只负责挂上，下一次 render() 会再剥离
  m.classList.add(dir === 'l' ? 'slide-l' : dir === 'r' ? 'slide-r' : 'view-enter');
}
function animateCountUp(selector = '.summary-nums .num') {
  $$(selector).forEach(el => {
    const target = parseInt(el.textContent, 10);
    if (!Number.isFinite(target) || target <= 0) return;
    const dur = 620, start = performance.now();
    el.textContent = '0';
    const tick = now => {
      const p = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 4)));
      if (p < 1) requestAnimationFrame(tick); else el.textContent = String(target);
    };
    requestAnimationFrame(tick);
  });
}
function afterViewRender(dir) {
  if (prefersReducedMotion()) return;
  animateMainEnter(dir);
  if (state.view === 'review') animateCountUp();
  if (state.view === 'stats') animateCountUp('.stat-tile .cnum');
}
function updateBadge() {
  const today = todayStr();
  const { overdue, dueToday, gradChecks } = getDueTasks(state.items, today);
  const n = overdue.length + dueToday.length + gradChecks.length;
  const badge = $('#due-badge');

  badge.textContent = n;
  badge.classList.toggle('hidden', n === 0);
}

// --- 复习页 ---
function stableGradOrder(gradChecks, today) {
  if (state.gradOrderDate !== today) {
    state.gradOrderDate = today;
    state.gradOrder = gradChecks.map(i => i.id);
  } else {
    const known = new Set(state.gradOrder);
    gradChecks.forEach(i => { if (!known.has(i.id)) state.gradOrder.push(i.id); });
  }
  const pos = new Map(state.gradOrder.map((id, idx) => [id, idx]));
  return gradChecks.slice().sort((a, b) => (pos.get(a.id) ?? 0) - (pos.get(b.id) ?? 0));
}

          <span class="confetti"><i></i><i></i><i></i><i></i><i></i><i></i></span>

        ${done} 题已全部完成，明天见！
      </div>`;
    } else {
      html += `<div class="empty">
        <svg class="calm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>

  const ICON_ALERT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`;
  const ICON_CAP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.92a1 1 0 0 0 0-1.84l-8.58-3.91a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>`;
  const ICON_CAL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>`;
  if (overdue.length) {
    html += `<div class="group-title red">${ICON_ALERT}逾期<span class="count-pill">${overdue.length}</span></div>`;
    for (const [subj, list] of groupBySubject(overdue)) {
      html += `<div class="sub-label">${escapeHtml(subj)}</div>`;
      html += list.map(i => taskCard(i, today)).join('');
    }
  }
  if (dueToday.length) {
    html += `<div class="group-title">${ICON_CAL}今日到期<span class="count-pill">${dueToday.length}</span></div>`;
    for (const [subj, list] of groupBySubject(dueToday)) {
      html += `<div class="sub-label">${escapeHtml(subj)}</div>`;
      html += list.map(i => taskCard(i, today)).join('');

  if (gradOrdered.length) {
    html += `<div class="group-title grad">${ICON_CAP}月度抽查<span class="count-pill">${gradOrdered.length}</span></div>`;
    html += gradOrdered.map(i => taskCard(i, today)).join('');
  }
  setMain(html);
}

function taskCard(item, today) {
  const seq = seqFor(item.subject);
  const isGrad = item.status === 'graduated';
  const late = !isGrad && item.dueDate < today ? diffDays(today, item.dueDate) : 0;
  const stage = isGrad
    ? `<span class="tag grad">已毕业 · 抽查</span>`
    : `<span class="tag stage">档位 ${item.intervalIndex + 1}/${seq.length} · ${seq[item.intervalIndex]}天</span>`;
  return `<div class="task-card ${late ? 'overdue' : ''} ${isGrad ? 'gradcheck' : ''}">
    <div class="task-top"><div class="task-source">${escapeHtml(item.source)}</div></div>
    <div class="task-meta">
      <span class="tag board-${item.board}">${BOARDS[item.board]}</span>
      <span class="tag subj">${escapeHtml(item.subject)}</span>
      ${stage}
      ${late ? `<span class="tag late">逾期 ${late} 天</span>` : ''}
    </div>
    ${item.note ? `<div class="task-note">${escapeHtml(item.note)}</div>` : ''}
    <div class="rate-row">
      <button class="rate-btn rate-good" onclick="rateItem('${item.id}','○',event)"><span class="mark">○</span><span class="lbl">秒杀</span></button>
      <button class="rate-btn rate-mid" onclick="rateItem('${item.id}','△',event)"><span class="mark">△</span><span class="lbl">想起但慢</span></button>
      <button class="rate-btn rate-bad" onclick="rateItem('${item.id}','×',event)"><span class="mark">×</span><span class="lbl">没思路</span></button>
    </div>
  </div>`;
}

function rateItem(id, rating, evt) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  const before = JSON.parse(JSON.stringify(item));
  const today = todayStr();
  applyRating(item, rating, today);
  saveItems(state.items); // 数据先落盘，动画只是表现层
  const seq = seqFor(item.subject);
  let msg;
  if (item.status === 'graduated' && before.status === 'learning') msg = `🎓 已毕业！30 天后抽查`;
  else if (item.status === 'graduated') msg = `抽查通过，30 天后再见`;
  else if (rating === '×') msg = `已重置，明天再来`;
  else msg = `下次复习: ${seq[item.intervalIndex]} 天后`;
  const finish = () => {
    render();
    showToast(`${rating} ${msg}`, () => {
      Object.assign(item, before);
      saveItems(state.items);
      render();
    });
  };
  // 按钮脉冲 + 卡片退场，再重渲染（reduced-motion 时直接完成）
  const card = evt && evt.target && evt.target.closest ? evt.target.closest('.task-card') : null;
  if (card && !prefersReducedMotion()) {
    const btn = evt.target.closest('.rate-btn');
    if (btn) btn.classList.add('pressed');
    // 固定当前高度后再加 .leaving：卡片滑出的同时高度收拢，后面的卡片平滑上移补位
    card.style.height = card.offsetHeight + 'px';
    void card.offsetWidth;
    card.classList.add('leaving');
    setTimeout(finish, 340);
  } else {
    finish();
  }
}
window.rateItem = rateItem;

// --- 专注模式（逐题复习会话，纯表现层：数据路径与列表评级完全一致） ---
let session = null;
let sessionUndoInfo = null;

function startSession() {
  const today = todayStr();
  const { overdue, dueToday, gradChecks } = getDueTasks(state.items, today);
  const queue = [...overdue, ...dueToday, ...stableGradOrder(gradChecks, today)].map(i => i.id);
  if (!queue.length) return;
  session = { queue, idx: 0, counts: { '○': 0, '△': 0, '×': 0 }, startedAt: Date.now() };
  sessionUndoInfo = null;
  renderSession();
}
window.startSession = startSession;

function sessionCurrentItem() {
  const today = todayStr();
  while (session && session.idx < session.queue.length) {
    const item = state.items.find(i => i.id === session.queue[session.idx]);
    // 题目可能已被删除，或已在列表中评过级（不再到期）→ 跳过
    if (item && item.dueDate <= today) return item;
    session.idx++;
  }
  return null;
}

function renderSession(dir) {
  const root = $('#session-root');
  if (!root) return;
  if (!session) { root.innerHTML = ''; return; }
  const item = sessionCurrentItem();
  const total = session.queue.length;
  const rated = session.counts['○'] + session.counts['△'] + session.counts['×'];
  if (!item) { renderSessionSummary(); return; }
  const seq = seqFor(item.subject);
  const isGrad = item.status === 'graduated';
  const today = todayStr();
  const late = !isGrad && item.dueDate < today ? diffDays(today, item.dueDate) : 0;
  const stage = isGrad
    ? `<span class="tag grad">已毕业 · 抽查</span>`
    : `<span class="tag stage">档位 ${item.intervalIndex + 1}/${seq.length} · ${seq[item.intervalIndex]}天</span>`;
  const pctDone = Math.round(rated / total * 100);
  // 卡片入场方向：评级→新卡从右滑入；撤销→原卡从左返回
  const enterClass = prefersReducedMotion() ? '' : (dir === 'back' ? 'swap-in-rev' : 'swap-in');
  root.innerHTML = `<div class="session ${session.entered ? '' : 'enter'}">
    <div class="session-top">
      <button class="session-close" onclick="endSession()" aria-label="退出复习">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div class="session-progress"><i style="width:${pctDone}%"></i></div>
      <span class="session-count">${Math.min(rated + 1, total)}/${total}</span>
    </div>
    <div class="session-body">
      <div class="session-card ${late ? 'overdue' : ''} ${isGrad ? 'gradcheck' : ''} ${enterClass}" id="session-card">
        <div class="session-source">${escapeHtml(item.source)}</div>
        <div class="task-meta">
          <span class="tag board-${item.board}">${BOARDS[item.board]}</span>
          <span class="tag subj">${escapeHtml(item.subject)}</span>
          ${stage}
          ${late ? `<span class="tag late">逾期 ${late} 天</span>` : ''}
        </div>
        ${item.note ? `<div class="task-note">${escapeHtml(item.note)}</div>` : ''}
      </div>
    </div>
    <div class="session-foot">
      <div class="session-rate">
        <button class="rate-btn rate-good xl" onclick="sessionRate('○')"><span class="mark">○</span><span class="lbl">秒杀</span></button>
        <button class="rate-btn rate-mid xl" onclick="sessionRate('△')"><span class="mark">△</span><span class="lbl">想起但慢</span></button>
        <button class="rate-btn rate-bad xl" onclick="sessionRate('×')"><span class="mark">×</span><span class="lbl">没思路</span></button>
      </div>
      <button class="session-undo ${sessionUndoInfo ? '' : 'hidden'}" onclick="sessionUndo()">撤销上一题</button>
    </div>
  </div>`;
  session.entered = true;
}

// 重叠式换卡：克隆旧卡为幽灵层滑出，同一时刻新卡滑入；进度条从旧值平滑推进
function animateCardSwap(prevPct) {
  const oldCard = $('#session-card');
  const oldBody = $('.session-body');
  if (!oldCard || !oldBody) { renderSession(); return; }
  const ghost = oldCard.cloneNode(true);
  const r = oldCard.getBoundingClientRect();
  const br = oldBody.getBoundingClientRect();
  renderSession();
  const body = $('.session-body'); // 总结页没有 body，此时自然跳过幽灵层
  if (body) {
    ghost.removeAttribute('id');
    ghost.className = oldCard.className.replace(/swap-in(-rev)?/g, '').trim() + ' ghost-out';
    ghost.style.cssText = `position:absolute;left:${r.left - br.left}px;top:${r.top - br.top}px;width:${r.width}px;margin:0;`;
    body.appendChild(ghost);
    setTimeout(() => ghost.remove(), 520);
  }
  const bar = $('.session-progress i');
  if (bar && Number.isFinite(prevPct)) {
    const target = bar.style.width;
    bar.style.transition = 'none';
    bar.style.width = prevPct + '%';
    void bar.offsetWidth; // 回流后恢复过渡，让宽度从旧值滑到新值
    bar.style.transition = '';
    bar.style.width = target;
  }
}

function sessionRate(rating) {
  if (!session) return;
  const item = sessionCurrentItem();
  if (!item) { renderSessionSummary(); return; }
  const before = JSON.parse(JSON.stringify(item));
  applyRating(item, rating, todayStr());
  saveItems(state.items); // 与列表评级同一数据路径，先落盘
  const total = session.queue.length;
  const ratedBefore = session.counts['○'] + session.counts['△'] + session.counts['×'];
  session.counts[rating]++;
  sessionUndoInfo = { id: item.id, before, rating, idx: session.idx };
  session.idx++;
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  const card = $('#session-card');
  if (card && !prefersReducedMotion()) {
    const btn = typeof event !== 'undefined' && event && event.target && event.target.closest
      ? event.target.closest('.rate-btn') : null;
    if (btn) btn.classList.add('pressed');
    const prevPct = Math.round(ratedBefore / total * 100);
    // 让按钮脉冲先被看到一瞬，再无缝换卡
    setTimeout(() => animateCardSwap(prevPct), 110);
  } else {
    renderSession();
  }
}
window.sessionRate = sessionRate;

function sessionUndo() {
  if (!session || !sessionUndoInfo) return;
  const item = state.items.find(i => i.id === sessionUndoInfo.id);
  if (item) {
    Object.assign(item, JSON.parse(JSON.stringify(sessionUndoInfo.before)));
    saveItems(state.items);
  }
  session.counts[sessionUndoInfo.rating] = Math.max(0, session.counts[sessionUndoInfo.rating] - 1);
  session.idx = sessionUndoInfo.idx;
  sessionUndoInfo = null;
  renderSession('back');
}
window.sessionUndo = sessionUndo;

function renderSessionSummary() {
  const root = $('#session-root');
  if (!root || !session) return;
  const { counts, startedAt } = session;
  const rated = counts['○'] + counts['△'] + counts['×'];
  if (rated === 0) { endSession(); return; }
  const mins = Math.max(1, Math.round((Date.now() - startedAt) / 60000));
  const rate = Math.round(counts['○'] / rated * 100);
  root.innerHTML = `<div class="session">
    <div class="session-summary">
      <div class="success-scene">
        <svg class="success-mark" viewBox="0 0 56 56"><circle class="ring" cx="28" cy="28" r="24"/><path class="tick" d="M18 29l7 7 13-14"/></svg>
        <span class="confetti"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="empty-title">本轮复习完成</div>
      <div class="sum-sub">共 ${rated} 题 · 用时约 ${mins} 分钟</div>
      <div class="sum-grid">
        <div><div class="num" style="color:var(--good)">${counts['○']}</div><div class="lbl">○ 秒杀</div></div>
        <div><div class="num" style="color:var(--mid)">${counts['△']}</div><div class="lbl">△ 想起但慢</div></div>
        <div><div class="num" style="color:var(--bad)">${counts['×']}</div><div class="lbl">× 没思路</div></div>
      </div>
      <div class="sum-meta"><span class="tag subj">○ 率 ${rate}%</span></div>
      <button class="btn" onclick="endSession()">完成</button>
    </div>
  </div>`;
  animateCountUp('.sum-grid .num');
}

function endSession() {
  session = null;
  sessionUndoInfo = null;
  const root = $('#session-root');
  if (root) root.innerHTML = '';
  render();
}
window.endSession = endSession;

function selectBook(name) {

}
window.selectBook = selectBook;
function addBook() {
  const name = (prompt('输入书名（例: 物理のエッセンス 緑）') || '').trim();
  if (!name) return;
  const key = bookKey(state.entryBoard, state.entrySubject);
  const list = state.books[key] || (state.books[key] = []);
  if (!list.includes(name)) {
    if (list.length >= 20) { alert('每组最多 20 本书'); return; }
    list.push(name);
    saveBooks(state.books);
  }
  selectBook(name);
}
window.addBook = addBook;
function removeBook(name) {
  const key = bookKey(state.entryBoard, state.entrySubject);
  const list = state.books[key] || [];
  const idx = list.indexOf(name);
  if (idx < 0) return;
  if (!confirm(`从常用书目移除「${name}」？（不影响已录入的题目）`)) return;
  list.splice(idx, 1);
  if (!list.length) delete state.books[key];
  if (state.entryBook === name) state.entryBook = null;
  saveBooks(state.books);
  renderEntry();
}
window.removeBook = removeBook;
function toggleBookEdit() {

  renderEntry();
}

function addItem() {
  const note = $('#entry-note').value.trim();
  const books = state.books[bookKey(state.entryBoard, state.entrySubject)] || [];
  const book = books.includes(state.entryBook) ? state.entryBook : null;
  let source;
  if (book) {
    const num = $('#entry-num')?.value.trim();
    if (!num) { $('#entry-num')?.focus(); return; }
    source = `${book} ${num}`;
  } else {
    source = $('#entry-source')?.value.trim();
    if (!source) { $('#entry-source')?.focus(); return; }

  const item = createItem(state.entrySubject, source, note, todayStr(), state.entryBoard);

  saveItems(state.items);
  render();
  showToast(`已添加，${displayDate(item.dueDate)} 首次复习`);

  ($('#entry-num') || $('#entry-source'))?.focus();
}

function deleteItem(id) {
  const idx = state.items.findIndex(i => i.id === id);

  state.items.splice(idx, 1);
  saveItems(state.items);
  render();
  showToast('已删除', () => {
    state.items.push(removed);
    saveItems(state.items);
    render();

function onImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.items)) { alert('无效的备份文件'); return; }
      const today = todayStr();
      const incoming = data.items.map(it => migrateAnyItem(it, today)).filter(Boolean);
      pendingImport = { items: incoming, books: normalizeBooks(data.books) };
      const mode = confirm(`读取到 ${incoming.length} 题。\n\n「确定」= 合并（按 ID 去重，保留较新一方）\n「取消」= 完全覆盖现有数据`);
      doImport(mode ? 'merge' : 'overwrite');
    } catch (err) {
      alert('文件读取失败:\n' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function doImport(mode) {
  if (!pendingImport) return;
  const incoming = pendingImport;
  pendingImport = null;
  if (mode === 'overwrite') {
    if (!confirm('将覆盖现有全部数据，无法撤销。确定吗？')) return;
    state.items = incoming.items;
    if (Object.keys(incoming.books).length) state.books = incoming.books;
  } else {
    const byId = new Map(state.items.map(i => [i.id, i]));
    incoming.items.forEach(i => byId.set(i.id, mergeItems(byId.get(i.id), i)));
    state.items = [...byId.values()].map(recomputeItem);
    state.books = mergeBooks(state.books, incoming.books);
  }
  saveItems(state.items);
  saveBooks(state.books);
  render();
  showToast(`导入完成，共 ${state.items.length} 题`);
}

// 合并两份复习记录：按 日期+评级 去重，再按时间排序。并集永不丢记录。
function mergeHistories(a, b) {
  const seen = new Set();
  const out = [];
  for (const h of [...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])]) {
    if (!h || !h.date || !h.rating) continue;
    const k = h.date + '|' + h.rating;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push({ date: h.date, rating: h.rating });
  }
  out.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  return out;
}
// 同一道题（同 id）跨设备合并：取复习记录并集后重算档位，让进度更靠前的一方胜出，
// 不再用时间戳整条二选一（旧逻辑会让"晚加载但更旧"的设备覆盖已复习的设备）。
function mergeItems(a, b) {
  if (!a) return recomputeItem(b);
  if (!b) return recomputeItem(a);
  const ta = Date.parse(a.updatedAt || '') || 0;
  const tb = Date.parse(b.updatedAt || '') || 0;
  const base = tb > ta ? b : a; // 出处/备注等可编辑字段取较新一方
  const merged = {
    ...base,
    addedDate: (a.addedDate && b.addedDate)
      ? (a.addedDate < b.addedDate ? a.addedDate : b.addedDate)
      : (a.addedDate || b.addedDate),
    legacy: a.legacy || b.legacy,
    history: mergeHistories(a.history, b.history),
    updatedAt: (tb > ta ? b.updatedAt : a.updatedAt) || new Date().toISOString(),
  };
  return recomputeItem(merged);
}

    .eq('user_id', state.sync.user.id)
    .maybeSingle();
  if (error) return setSyncStatus(cloudErrorMessage(error));
  if (data?.data) {
    applyMergedCloudData(data.data);
    state.sync.lastSynced = data.updated_at || new Date().toISOString();
    await pushCloudData(true);
    if (!silent) showToast('已与云端同步');
  } else {
    await pushCloudData(true);
  }
  setSyncStatus('已同步');
  render();
}
async function pushCloudData(silent = false) {
  const sb = getSupabase();
  if (!sb || !state.sync.user) return;
  if (!silent) setSyncStatus('正在保存到云端...', true);
  const now = new Date().toISOString();
  const { error } = await sb
    .from('eju_sync')
    .upsert({ user_id: state.sync.user.id, data: cloudDataPayload(), updated_at: now },
      { onConflict: 'user_id' });
  if (error) return setSyncStatus(cloudErrorMessage(error));
  state.sync.lastSynced = now;
  setSyncStatus('已同步');
  if (!silent) showToast('已保存到云端');
}
window.cloudSignUp = cloudSignUp;
window.cloudSignIn = cloudSignIn;
window.cloudSignOut = cloudSignOut;
window.pullCloudData = pullCloudData;
window.pushCloudData = pushCloudData;

function renderSyncCard() {
  if (!state.sync.available) {
    return `<div class="card">
      <div class="section-title" style="margin-top:0">云同步</div>
      <div class="small danger-text">同步库未能加载（离线或 CDN 不可用）。本地功能不受影响。</div>
    </div>`;
  }
  const last = state.sync.lastSynced ? displayDate(state.sync.lastSynced.slice(0, 10)) : '-';
  if (state.sync.user) {
    return `<div class="card">
      <div class="section-title" style="margin-top:0">云同步</div>
      <div class="small mb12">已登录: ${escapeHtml(state.sync.email)}<br>状态: ${escapeHtml(state.sync.status)} · 最近同步: ${last}</div>
      <div class="row">
        <button class="btn small" onclick="pushCloudData()" ${state.sync.busy ? 'disabled' : ''}>立即上传</button>
        <button class="btn small secondary" onclick="pullCloudData()" ${state.sync.busy ? 'disabled' : ''}>从云端拉取</button>
        <button class="btn small secondary" onclick="cloudSignOut()" ${state.sync.busy ? 'disabled' : ''}>退出登录</button>
      </div>
    </div>`;
  }
  return `<div class="card">
    <div class="section-title" style="margin-top:0">云同步</div>
    <div class="small mb12">用邮箱登录后可在手机和电脑间同步。状态: ${escapeHtml(state.sync.status)}</div>
    <input type="email" class="form-input mb8" id="sync-email" placeholder="邮箱" autocomplete="email">
    <input type="password" class="form-input mb8" id="sync-password" placeholder="密码" autocomplete="current-password">
    <div class="row">
      <button class="btn small" onclick="cloudSignIn()" ${state.sync.busy ? 'disabled' : ''}>登录</button>
      <button class="btn small secondary" onclick="cloudSignUp()" ${state.sync.busy ? 'disabled' : ''}>注册</button>
    </div>
    <div class="tiny mt12">首次登录时会自动合并本机与云端数据（按题目 ID，保留较新一方）。</div>
  </div>`;
}

// ---------- Toast ----------
function showToast(msg, undoFn) {
  if (toastTimer) clearTimeout(toastTimer);
  const wrap = $('#toast-wrap');
  wrap.innerHTML = `<div class="toast"><span>${escapeHtml(msg)}</span>${undoFn ? '<button class="undo" id="toast-undo">撤销</button>' : ''}</div>`;
  if (undoFn) {
    $('#toast-undo').addEventListener('click', () => {
      undoFn();
      wrap.innerHTML = '';
      clearTimeout(toastTimer);
      toastTimer = null;
    });
  }
  toastTimer = setTimeout(() => {
    const t = wrap.querySelector('.toast');
    if (t && !prefersReducedMotion()) {
      t.classList.add('toast-leave');
      toastTimer = setTimeout(() => { wrap.innerHTML = ''; toastTimer = null; }, 200);
    } else {
      wrap.innerHTML = '';
      toastTimer = null;
    }
  }, undoFn ? 5000 : 2400);
}

// ---------- 初始化 ----------
function init() {
  state.items = fixMathSubjectNameOnce(fixEssenceMidoriOnce(loadAndMigrateItems()));
  state.books = loadBooks();
  suppressCloudSync = true;
  saveItems(state.items); // 持久化迁移/补全结果
  seedPresetBooks();
  suppressCloudSync = false;
  $$('.nav-btn').forEach(btn => btn.addEventListener('click', () => navigate(btn.dataset.view)));
  $('#import-file').addEventListener('change', onImportFile);
  $('#today-date').textContent = displayDate(todayStr());
  // 跨日自动刷新（页面长开时）
  let shownDay = todayStr();
  setInterval(() => {
    const t = todayStr();
    if (t !== shownDay) {
      shownDay = t;
      $('#today-date').textContent = displayDate(t);
      render();
    }
  }, 60 * 1000);
  render();
  afterViewRender();
  // supabase-js 是 defer 加载的：就绪则立即启动同步，否则等页面 load 后再启动
  if (window.supabase) initCloudSync();
  else window.addEventListener('load', initCloudSync, { once: true });
}
if (typeof document !== 'undefined' && typeof window !== 'undefined' && !window.__EJU_TEST__) {
  init();
}
</script>
