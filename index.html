<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>EJU Review</title><script>(async()=>{const base='https://raw.githubusercontent.com/Zuzu0124/eju-review-site/36922193b695120b4f88a84e49005e163a546344/index.html';const wrapper=await fetch(base).then(r=>r.text());const b=wrapper.match(/let b='([^']+)'/)[1];const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));let h=await new Response(s).text();const fix=`<script>(()=>{function t(i){const a=[i&&i.updatedAt,i&&i.modifiedAt,i&&i.createdAt,...(Array.isArray(i&&i.reviews)?i.reviews.map(r=>r.completedAt).filter(Boolean):[])];return Math.max(0,...a.map(v=>Date.parse(v||'')||0))}function d(i){return Array.isArray(i&&i.reviews)?i.reviews.filter(r=>r.status==='done').length:0}function pick(l,r){if(!l)return r;if(!r)return l;const lt=t(l),rt=t(r);if(lt!==rt)return lt>rt?l:r;const ld=d(l),rd=d(r);if(ld!==rd)return ld>rd?l:r;return l}window.touchItem=function(i){if(i)i.updatedAt=new Date().toISOString()};applyMergedCloudData=function(remoteData){const remoteItems=Array.isArray(remoteData&&remoteData.items)?remoteData.items.map(normalizeItem).filter(Boolean):[];const byId=new Map();remoteItems.forEach(i=>byId.set(i.id,i));state.items.map(normalizeItem).filter(Boolean).forEach(i=>byId.set(i.id,pick(i,byId.get(i.id))));state.items=Array.from(byId.values());state.settings=loadValidatedSettings((remoteData&&remoteData.settings)||state.settings);state.suggestions=mergeSuggestions(state.suggestions,remoteData&&remoteData.suggestions);suppressCloudSync=true;saveItems(state.items);saveSettings(state.settings);saveSuggestions(state.suggestions);suppressCloudSync=false};const oldComplete=completeReview;completeReview=function(itemId,reviewIndex,quality='good',silent=false){oldComplete(itemId,reviewIndex,quality,silent);const item=state.items.find(i=>i.id===itemId);if(item){touchItem(item);saveItems(state.items)}};
